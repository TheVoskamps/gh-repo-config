version: 2
updates:
  - package-ecosystem: "bundler"
    directories:
      - "**/*"
    target-branch: "main"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      aws-cdk:
        patterns:
          - "aws-cdk"
          - "aws-cdk-lib"
          - "@aws-cdk/*"
          - "constructs"
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "rollup"
          - "typescript"
          - "vue"
          - "@vue/*"
          - "@vitest/*"
          - "vitest"
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "pydantic"
          - "pydantic-*"
          - "pydantic_*"
          - "uvicorn"
          - "uvicorn-*"
      sqlalchemy-stack:
        patterns:
          - "sqlalchemy"
          - "alembic"
          - "asyncpg"
          - "psycopg"
          - "psycopg2"
          - "psycopg2-binary"
      auth-stack:
        patterns:
          - "authlib"
          - "python-jose"
          - "python-jose[*]"
          - "pyjwt"
          - "cryptography"
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
          - "aiobotocore"
          - "s3transfer"
      test-stack:
        patterns:
          - "pytest"
          - "pytest-*"
      bundler-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      bundler-security:
        applies-to: security-updates
        patterns:
          - "*"
