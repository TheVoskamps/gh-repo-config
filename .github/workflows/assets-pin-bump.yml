# REPO-OWN workflow — NOT part of the sweep's rendered payload set.
# Everything else under .github/workflows/ in this repo is a converged
# copy of assets/*.yml, rewritten every time the fanout sweep runs over
# this repo (see the "Structure" section of CLAUDE.md). This file is
# hand-maintained here and only here: it has no assets/ counterpart and
# the sweep never reads, renders, or overwrites it.
#
# Scheduled + manual bumper (issue #60) for the `uses:` action pins in
# assets/*.yml -- the fanout's authoritative payload templates.
# Dependabot's github-actions ecosystem can only scan .github/workflows/
# (plus a root action.yml), so it has no way to reach these templates;
# this workflow is what keeps them current instead. See the "Problem"
# section of issue #60.
#
# All of the update-policy DECISION logic (security-bypass, 7-day soak,
# semver-major gate) lives in scripts/bump-asset-pins.sh, which only
# rewrites files -- it never touches git or opens a PR. This workflow
# owns that plumbing: it runs the script, and only if it actually
# changed something (`git status --porcelain` is non-empty) does it
# commit, push a branch, and open a PR. No eligible bumps -> no diff ->
# no branch, no PR.
#
# Auth: this workflow MUST mint a short-lived GitHub App installation
# token (from the AUTOMERGE_APP_ID / AUTOMERGE_APP_PRIVATE_KEY repo
# secrets -- the same PR-operations App auto-rebase-prs.yml and
# auto-enable-automerge.yml already use, and the same mint-step shape)
# and use it to open the PR. Do NOT fall back to the default
# GITHUB_TOKEN: a PR opened with GITHUB_TOKEN does not trigger
# `pull_request` workflows (GitHub design, to prevent infinite
# recursion), so neither ci.yml nor pin-shape.yml would ever run on
# this workflow's own PRs, and those PRs could never satisfy the
# ci-required / pin-shape-required checks the repo-required-checks
# ruleset requires -- see assets/auto-rebase-prs.yml's own Auth
# section for the identical constraint on pushes.
#
# Do NOT use CONVERGER_APP_ID / CONVERGER_APP_PRIVATE_KEY. That App
# carries Administration and Org administration scope for the sweep;
# this job parses untrusted upstream release notes and advisory text
# and must not hold org-level authority.
name: assets-pin-bump

on:
  schedule:
    # Daily at 09:00 UTC. Idempotent (no eligible bump -> no PR), so
    # over-running is harmless.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# Only the checkout's implicit GITHUB_TOKEN usage is governed here (the
# App installation token below carries its own permissions and is used
# explicitly for every privileged git/API operation). Keep this block
# minimal; contents: read is enough for a plain checkout.
permissions:
  contents: read

concurrency:
  group: assets-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Run bump-asset-pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/bump-asset-pins.sh

      - name: Check for changes
        id: diff
        run: |
          if git status --porcelain assets/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No eligible pin bumps found -- nothing to do."
          fi

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, push, and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          BASE_SHA="$(git rev-parse HEAD)"
          BRANCH="assets-pin-bump/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add assets/
          git commit -m "Bump assets/ action pins to current eligible releases"
          git push origin "HEAD:refs/heads/${BRANCH}"

          # Diff against the checked-out HEAD's own SHA, not a local
          # `main` ref name -- actions/checkout only creates a local
          # branch for the ref it checks out, so on a workflow_dispatch
          # run from any branch other than main, `main` would not
          # resolve as a rev and this step (under set -euo pipefail)
          # would fail AFTER the branch and PR-worthy commit have
          # already been pushed.
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA".."$BRANCH" -- assets/ | sed 's/^/- `/; s/$/`/')"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Bump assets/ action pins to current eligible releases" \
            --body "$(cat <<BODY
## Summary

Scheduled bump of \`uses:\` action pins in \`assets/*.yml\` (the
fan-out's authoritative payload templates) to the current eligible
upstream release, per the policy in \`scripts/bump-asset-pins.sh\`:
security fixes are taken immediately, everything else soaks 7 days,
and semver-major bumps are limited to the \`github/codeql-action/*\`
named group.

Files changed:
${CHANGED_FILES}

Generated by \`.github/workflows/assets-pin-bump.yml\`.
BODY
          )"
