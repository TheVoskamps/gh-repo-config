# REPO-OWN workflow — NOT part of the sweep's rendered payload set.
# Everything else under .github/workflows/ in this repo is a converged
# copy of assets/*.yml, rewritten every time the fanout sweep runs over
# this repo (see the "Structure" section of CLAUDE.md). This file is
# hand-maintained here and only here: it has no assets/ counterpart and
# the sweep never reads, renders, or overwrites it.
#
# Scheduled + manual bumper (issue #60) for the `uses:` action pins in
# assets/*.yml -- the fanout's authoritative payload templates.
# Dependabot's github-actions ecosystem can only scan .github/workflows/
# (plus a root action.yml), so it has no way to reach these templates;
# this workflow is what keeps them current instead. See the "Problem"
# section of issue #60.
#
# All of the update-policy DECISION logic (security-bypass, 7-day soak,
# semver-major gate) lives in scripts/bump-asset-pins.sh, which only
# rewrites files -- it never touches git or opens a PR. This workflow
# owns that plumbing: it runs the script, and only if it actually
# changed something (`git status --porcelain` is non-empty) does it
# commit, push a branch, and open a PR. No eligible bumps -> no diff ->
# no branch, no PR.
#
# Auth: this workflow MUST mint a short-lived GitHub App installation
# token (from the AUTOMERGE_APP_ID / AUTOMERGE_APP_PRIVATE_KEY repo
# secrets -- the same PR-operations App auto-rebase-prs.yml and
# auto-enable-automerge.yml already use, and the same mint-step shape)
# and use it to open the PR. Do NOT fall back to the default
# GITHUB_TOKEN: a PR opened with GITHUB_TOKEN does not trigger
# `pull_request` workflows (GitHub design, to prevent infinite
# recursion), so neither ci.yml nor pin-shape.yml would ever run on
# this workflow's own PRs, and those PRs could never satisfy the
# ci-required / pin-shape-required checks the repo-required-checks
# ruleset requires -- see assets/auto-rebase-prs.yml's own Auth
# section for the identical constraint on pushes.
#
# Do NOT use CONVERGER_APP_ID / CONVERGER_APP_PRIVATE_KEY. That App
# carries Administration and Org administration scope for the sweep;
# this job parses untrusted upstream release notes and advisory text
# and must not hold org-level authority.
#
# Token-scoping (defense-in-depth): the App token is minted up front
# (create-github-app-token has no per-step scoping), but it is kept
# OUT of the checkout and the bump-asset-pins step, which parse
# attacker-controlled upstream release/advisory text. The checkout
# uses the ambient github.token (read-only, contents: read is all a
# plain checkout needs) with persist-credentials: false, and the
# bump script itself only ever makes read-only GitHub API calls (see
# its own header). The App token is introduced for the first time in
# the commit/push/PR step below, which is trusted, non-parsing
# plumbing.
#
# Branch/PR strategy: this mirrors src/converge/writer.ts's own
# fixed-branch, open-or-update contract rather than inventing a
# second pattern. A FIXED branch (BRANCH below) is force-reset onto
# the current main every run; the workflow looks for an already-open
# PR on that branch before creating a new one, so a lingering
# not-yet-merged bump is updated in place instead of accumulating a
# fresh duplicate PR every day.
name: assets-pin-bump

on:
  schedule:
    # Daily at 09:00 UTC. Idempotent (no eligible bump -> no PR), so
    # over-running is harmless.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

# The ambient github.token is used for the checkout and the bump
# script's own read-only API calls (contents: read covers both). The
# App installation token minted below carries its own permissions and
# is used explicitly for the commit/push/PR step instead of widening
# this block.
permissions:
  contents: read

concurrency:
  group: assets-pin-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run bump-asset-pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/bump-asset-pins.sh

      - name: Check for changes
        id: diff
        run: |
          if git status --porcelain assets/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No eligible pin bumps found -- nothing to do."
          fi

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit, push, and open-or-update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Fixed branch (mirrors src/converge/writer.ts's CONVERGE_BRANCH
          # contract): every run force-resets this SAME branch onto the
          # current main plus today's eligible bumps, rather than opening
          # a new timestamped branch/PR each time. A prior run's
          # still-open PR is updated in place (the push below force-
          # updates its head), never duplicated.
          BASE_SHA="$(git rev-parse HEAD)"
          BRANCH="assets-pin-bump/main"

          # The App token is introduced here for the first time -- the
          # checkout and the bump script above ran with only the ambient
          # read-only github.token. Rewrite the remote to carry it rather
          # than persisting it into .git/config for the whole job.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git checkout -b "$BRANCH"
          git add assets/
          git commit -m "Bump assets/ action pins to current eligible releases"
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          # Diff against the checked-out HEAD's own SHA, not a local
          # `main` ref name -- actions/checkout only creates a local
          # branch for the ref it checks out, so on a workflow_dispatch
          # run from any branch other than main, `main` would not
          # resolve as a rev and this step (under set -euo pipefail)
          # would fail AFTER the branch and PR-worthy commit have
          # already been pushed.
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA".."$BRANCH" -- assets/ | sed 's/^/- `/; s/$/`/')"

          # Open-or-update: skip gh pr create entirely when a bumper PR
          # is already open on this branch -- the force-push above
          # already carried today's rewrite into it. Creating a second
          # PR on the same head branch would fail anyway, but checking
          # first keeps the intent explicit and avoids depending on that
          # failure mode.
          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            echo "Bumper PR #${EXISTING_PR} is already open on ${BRANCH} -- updated in place, not opening a new one."
            exit 0
          fi

          # Build the PR body with printf (one call per line) rather
          # than a heredoc: a heredoc's closing delimiter must start at
          # column 0 for a plain `<<WORD` form, but a column-0 line here
          # would terminate this step's `run: |` YAML block scalar early
          # (see actionlint failure on an earlier revision of this
          # file). `<<-WORD` avoids that by stripping leading TABS from
          # the delimiter, but embedding literal tabs inside a YAML
          # block scalar is itself invalid YAML ("found a tab character
          # where an indentation space is expected"). printf sidesteps
          # both constraints: every line stays a normal, space-indented
          # statement inside the block scalar, and nothing needs to be
          # stripped back out of the rendered PR body.
          PR_BODY_FILE="$(mktemp)"
          {
            printf '%s\n' '## Summary'
            printf '\n'
            printf '%s\n' 'Scheduled bump of `uses:` action pins in `assets/*.yml` (the'
            printf '%s\n' "fan-out's authoritative payload templates) to the current eligible"
            printf '%s\n' 'upstream release, per the policy in `scripts/bump-asset-pins.sh`:'
            printf '%s\n' 'security fixes are taken immediately, everything else soaks 7 days,'
            printf '%s\n' 'and semver-major bumps are limited to the `github/codeql-action/*`'
            printf '%s\n' 'named group.'
            printf '\n'
            printf '%s\n' 'Files changed:'
            printf '%s\n' "${CHANGED_FILES}"
            printf '\n'
            printf '%s\n' 'Generated by `.github/workflows/assets-pin-bump.yml`.'
          } > "$PR_BODY_FILE"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Bump assets/ action pins to current eligible releases" \
            --body-file "$PR_BODY_FILE"
