# Dependency-install-gate workflow rendered by /gh-repo-setup-protection.
#
# Installed at <repo-root>/.github/workflows/dependency-install-gate.yml
# (alongside its sibling script at
# <repo-root>/.github/scripts/dependency-install-gate.sh).
#
# ARMED WITH THE FULL SUPPORTED SET — runtime-gated, fails OPEN. This
# workflow is armed with EVERY supported package manager (`npm`, `pnpm`,
# `yarn`, `pip`) at install time, and decides WHICH to gate at RUNTIME,
# per PR. A detect STEP runs `dependency-install-gate.sh --present`
# (the SAME `git ls-files` discovery the gate itself uses) and emits a
# JSON array of the PMs whose manifest is actually present; the run loop
# then checks exactly those, so a PM is checked IFF that PM's
# lockfile/manifest is in the tree right now:
#   - present + clean   -> that PM passes,
#   - present + drifted -> that PM fails (blocking),
#   - absent            -> NOT checked at all (fails OPEN — no phantom
#                          check, no empty-green noise).
# A PM whose manifest lands AFTER setup (e.g. the repo's first
# `package-lock.json`) is picked up automatically on the next PR, with
# NO skill re-run.
#
# Each Node package manager keys off its OWN lockfile (npm ->
# package-lock.json, pnpm -> pnpm-lock.yaml, yarn -> yarn.lock), so a
# pnpm/yarn repo is gated by the right tool instead of silently passing
# an npm-only check (the dead-check / false-assurance bug this rendering
# fixes, issue #111).
#
# ONE JOB, NOT THREE (issue #77). This workflow used to be a `detect`
# job, a `gate` matrix with one leg per present PM, and an
# `if: always()` `install-gate-required` aggregator. GitHub bills a
# whole minute per JOB, rounded up, and each of those jobs did seconds
# of real work: across a measured 3.7-day window the two dependency
# gates spent 324 billable minutes on their `detect` + `*-required`
# wrapper jobs alone. A check NAME is free on GitHub; a JOB is the
# billing unit. So detection is a STEP, the per-PM legs are a LOOP, and
# the single remaining job KEEPS the name `install-gate-required` — the
# name `protect-main-ruleset.json` lists as the required status check,
# which is therefore unchanged by the collapse. Collapsing also removes
# real work, not just round-up: ONE checkout and ONE `setup-node`
# instead of one per leg.
#
# Every invariant of the previous three-job shape survives: still
# runtime-armed per PR, still fails open when no manifest is present,
# still no phantom check (the job always runs and always concludes, so
# a required check is never left pending — the #91/#230 hang this
# shape's `if: always()` aggregator originally fixed cannot return).
#
# PER-PM VISIBILITY — the trade-off this collapse makes, and how it is
# paid for. The three-job shape gave each PM its own check NAME, so a
# red `Install gate (pnpm)` named the failing PM in the PR's checks
# list. Collapsed, there is one red `install-gate-required` and the PM
# is one click away in the log. That regression is deliberately bought
# back INSIDE the job rather than with extra jobs:
#   - a JOB SUMMARY table lists every checked PM with PASS/FAIL,
#     rendered on the run page with no log-diving at all, and
#   - a `::error title=install-gate (<pm>)::` ANNOTATION is emitted per
#     failing PM, which surfaces on the run page and in the PR's Checks
#     tab naming the PM — NOT on the Files changed tab. An annotation
#     emitted with no `file=` parameter defaults to `file=.github`,
#     `line=1` per GitHub's workflow-command parameter table, so it is
#     attached to no file in the diff and the diff view never shows it.
#     The loop cannot do better: it only ever learns WHICH package
#     manager failed, not where. Diff-attached annotations come from the
#     gate script instead — dependency-install-gate.sh emits its own
#     `::error file=<manifest>::` per failing manifest, and those DO
#     land on Files changed when the manifest is part of the diff.
# Both are free — annotations and summaries are step output, not jobs.
#
# RUN-ALL-THEN-FAIL. The loop never short-circuits: every present PM is
# checked even after one fails, and the job exits non-zero at the end.
# This preserves the `fail-fast: false` behaviour of the matrix it
# replaces, so one PR iteration surfaces every drifted PM rather than
# one per push.
#
# Purpose: block a drifted package.json/<lockfile> (or an unresolvable
# requirements pin) from auto-merging into the default branch.
# Dependabot PRs and hand edits can desync a lockfile from its manifest;
# without a PR-time gate the desync merges and breaks local dev and
# downstream pipelines. Proven against ExampleProject's
# example-app-repo workflow.
#
# Install-integrity ONLY -- there is NO build step (`npm run build`,
# `cdk synth`, etc.); build coverage is out of scope. The discovery +
# run-all-then-fail logic lives in the sibling script
# .github/scripts/dependency-install-gate.sh.
#
# TOOLCHAIN SETUP IS CONDITIONAL, OFF THE DETECT STEP. In the matrix
# shape each leg knew its own PM, so `Set up Node` and the
# CodeArtifact auth step were guarded per leg with
# `if: matrix.pm != 'pip'`. There is no `matrix.pm` in a single job, so
# those guards are now STEP-LEVEL conditions computed by the detect
# step: `node` is true when any of npm/pnpm/yarn is present, `pip` when
# pip is. This is load-bearing, not tidiness — see the CodeArtifact note
# below.
#
# It is also the whole reason detection is its own STEP here while the
# sibling dependency-pinned-gate keeps its `--present` call inline at the
# head of its single check step: a step-level `if:` can only read another
# STEP's outputs, so the guarded steps below force a step boundary the
# pinned gate has no consumer for. The asymmetry is deliberate; do not
# "harmonize" it away in either direction.
#
# CODEARTIFACT-BACKED REGISTRIES. The installs are real, so they resolve
# against whatever registry the repo declares. When that is an AWS
# CodeArtifact repository the install needs an authorization token, which
# needs AWS credentials, which in GitHub Actions means OIDC. The job
# therefore calls the fanned-out `./.github/actions/codeartifact-auth`
# composite action AFTER checkout and BEFORE the install loop (that
# ordering is required: the loop's npm/pnpm/yarn installs read the
# credential the action writes); it no-ops on a repo where the
# `CODEARTIFACT_ROLE` variable is unset. The step is skipped entirely on
# a repo with no Node PM present: without that guard a pip-only repo
# would still perform a real `AssumeRoleWithWebIdentity` and a real
# `get-authorization-token`, so an AWS-side failure would redden a
# REQUIRED check on a repo with no CodeArtifact dependency at all. (A
# CodeArtifact-backed PyPI registry is out of scope -- see
# docs/codeartifact-auth.md.)
#
# Hardening invariants (do not regress these — see issue #222 item 9):
#   - Every action is SHA-pinned (a floating @v4/@v5 tag is a supply-
#     chain risk; the trailing comment records the human-readable tag).
#   - Least privilege: `contents: read` workflow-wide, and the ONLY
#     elevation is `id-token: write` on this job (see the comment
#     there). Note that the collapse moves that grant ONTO the job that
#     is the required check, because they are now the same job; the
#     grant's scope is unchanged (one job, this workflow only) and the
#     latency-vs-latency reasoning below is unaffected.
#   - The job checks out github.event.pull_request.head.sha so the
#     gate validates the PR head, not a merge commit.
#   - Every install blocks install/build lifecycle scripts (an
#     arbitrary-code-execution vector from a malicious/compromised
#     lockfile entry): npm `--ignore-scripts`, pnpm `--ignore-scripts`,
#     yarn `--ignore-scripts` (v1) / `--mode=skip-build` (Berry). The
#     integrity check never needs scripts to run, so none are allowed.
#
# Placeholders:
#   main   Default branch of the target repo. The gate
#                        runs on pull_request events targeting it.
#
# There is intentionally NO per-job delimiter-comment rendering: the
# armed set is the full supported set, fixed in this template, and
# narrowed to the present set at RUNTIME by the detect step — never at
# install time.
name: dependency-install-gate

on:
  pull_request:
    branches: [main]

# Least-privilege: the gate only reads the tree to replay lockfiles and
# run the resolver pre-flight. No write scopes are needed.
permissions:
  contents: read

jobs:
  # THE SINGLE JOB, and the single required status check. Detection,
  # toolchain setup, CodeArtifact auth, every per-PM strict install, and
  # the verdict all happen here; see the "ONE JOB, NOT THREE" note in
  # the header for why. The `protect-main` ruleset lists THIS job's name
  # (`install-gate-required`) as the required check.
  install-gate-required:
    name: install-gate-required
    runs-on: ubuntu-latest
    # `id-token: write` lets THIS job mint an OIDC token for
    # ./.github/actions/codeartifact-auth, which exchanges it for an AWS
    # role and then for a CodeArtifact authorization token. A job-level
    # `permissions:` block REPLACES the workflow-level one, so
    # `contents: read` is restated here.
    #
    # ON A REPO WITHOUT CODEARTIFACT THE GRANT IS LATENT, and that is
    # intentional: such a repo can mint an OIDC token, but it is named in
    # no IAM role's trust policy, so no role will accept it -- and the
    # action itself no-ops when `CODEARTIFACT_ROLE` is unset. `permissions:`
    # is static YAML and cannot be made conditional, and converge-time
    # detection was considered and rejected: the converger reads the
    # DEFAULT BRANCH while this gate runs against the PR HEAD, so a
    # runtime check would still be required and the converge-time copy
    # would be a second, weaker implementation of the same rule. Worse,
    # this gate is a REQUIRED check -- a repo that adopted CodeArtifact
    # between sweeps would have every PR blocked until a scheduled run
    # corrected it. Arming broadly and deciding at runtime is the
    # precedent `dependency-pinned-gate` already documents. What IS
    # conditional at runtime is the auth STEP itself (see its `if:`
    # below), which is what keeps a pip-only repo from ever exercising
    # the grant.
    #
    # OPERATOR REQUIREMENT: IAM trust policies must name concrete
    # repositories in their `sub` condition, never wildcards. A wildcard
    # would let any repo in the org assume the role, which is exactly what
    # this latent grant would otherwise expose.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Runs BEFORE the toolchain setup steps because they are gated on
      # its outputs. `--present` itself needs no toolchain beyond what
      # the runner image already ships (it is `git ls-files` discovery
      # plus stdlib python3 for pyproject parsing) — the same
      # arrangement the `detect` job this step replaces relied on.
      - name: Detect present package managers
        id: detect
        run: |
          set -euo pipefail

          # `--present` emits a JSON array of the PMs whose manifest is
          # in the tracked tree, e.g. ["npm","pip"], or `[]` when none
          # are.
          present="$(bash .github/scripts/dependency-install-gate.sh --present)"
          csv="$(printf '%s' "${present}" | tr -d '[]" ')"
          echo "Present package managers: ${present}"

          # `node` arms `Set up Node` AND the CodeArtifact auth step;
          # `pip` arms `Set up Python`. Computed here rather than in the
          # steps' own `if:` expressions because only a shell can split
          # the array.
          node=false
          pip=false
          if [ -n "${csv}" ]; then
            IFS=',' read -r -a pms <<< "${csv}"
            for pm in "${pms[@]}"; do
              if [ "${pm}" = "pip" ]; then
                pip=true
              else
                node=true
              fi
            done
          fi

          {
            echo "pm_csv=${csv}"
            echo "node=${node}"
            echo "pip=${pip}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Node
        if: ${{ steps.detect.outputs.node == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        if: ${{ steps.detect.outputs.pip == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Skipped when no Node package manager is present, mirroring
      # `Set up Node` above and preserving the per-leg
      # `if: matrix.pm != 'pip'` guard the matrix shape carried: the
      # action configures npm, pnpm, and yarn Berry, none of which pip
      # reads, and an unguarded run would perform a real
      # `AssumeRoleWithWebIdentity` on a repo with no role for it. Must
      # run BEFORE the install loop below, which is what consumes the
      # credential it writes.
      - name: Authenticate against CodeArtifact
        if: ${{ steps.detect.outputs.node == 'true' }}
        uses: ./.github/actions/codeartifact-auth
        with:
          role: ${{ vars.CODEARTIFACT_ROLE }}

      - name: Strict install over every present package manager
        env:
          # Passed through the environment rather than interpolated into
          # the script body, so the detect step's output is data to the
          # shell and never shell syntax.
          PM_CSV: ${{ steps.detect.outputs.pm_csv }}
        run: |
          set -euo pipefail

          {
            echo "## install-gate-required"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          # Fail OPEN, and do it BEFORE splitting: a manifest-less repo
          # is mergeable, not hung, and the empty case never reaches the
          # loop (which also keeps `"${pms[@]}"` off an unset array
          # under `set -u`).
          if [ -z "${PM_CSV}" ]; then
            echo "PASS — no supported package manager present in the tracked tree (fail-open)."
            echo "No supported package manager is present in the tracked tree; nothing to check (fail-open)." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Split EXPLICITLY into an array. Relying on the shell's
          # default word splitting of an unquoted expansion works under
          # bash but not under every shell this block might be pasted
          # into, and the failure mode is silent: the loop would run
          # ONCE with "npm pip" as a single word, the script would hit
          # its usage branch, and the required check would go red for a
          # reason that has nothing to do with the repo's lockfiles.
          IFS=',' read -r -a pms <<< "${PM_CSV}"

          {
            echo "| package manager | result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Run-all-then-fail: never short-circuit, so one PR iteration
          # surfaces every drifted package manager.
          rc=0
          for pm in "${pms[@]}"; do
            echo "=== install-gate: ${pm} ==="
            if bash .github/scripts/dependency-install-gate.sh "${pm}"; then
              echo "| \`${pm}\` | PASS |" >> "${GITHUB_STEP_SUMMARY}"
            else
              rc=1
              echo "| \`${pm}\` | **FAIL** |" >> "${GITHUB_STEP_SUMMARY}"
              echo "::error title=install-gate (${pm})::The ${pm} strict install did not replay cleanly — a lockfile is desynced from its manifest, or a pin set is unresolvable. See the \"install-gate: ${pm}\" section of this job's log."
            fi
          done

          if [ "${rc}" -ne 0 ]; then
            echo "install-gate: FAIL — at least one present package manager did not replay cleanly." >&2
          else
            echo "install-gate: PASS — every present package manager replayed cleanly."
          fi
          exit "${rc}"
