# REPO-OWN workflow — NOT part of the sweep's rendered payload set.
# The workflows here that the sweep renders from assets/*.yml are
# converged copies, rewritten every time the fanout sweep runs over this
# repo (see docs/rules/workflows-and-payloads.md); the rest, this file
# among them, are not. This file is hand-maintained here and only here:
# it has no assets/ counterpart and the sweep never reads, renders, or
# overwrites it.
#
# Runs this repo's own build, unit-test suite, payload self-tests, and
# lint over every pull request (issue #58). Before this workflow
# existed, `npm test` executed only inside release.yml (triggered by a
# `v*` tag push, i.e. once per release, after the code already merged
# to main), and the five assets/test-*.sh payload self-tests ran in no
# workflow at all.
name: ci

on:
  pull_request:
    branches: [main]

# Least-privilege: every job only reads the tree to build/test/lint it.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Installs the pnpm version `package.json`'s `packageManager` pins.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm test

  payload-self-tests:
    name: Payload self-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Each assets/test-*.sh and scripts/test-*.sh is a hermetic
      # self-test of its sibling *.sh script (no GitHub runner state or
      # network needed). Looping over the discovered set (rather than
      # hardcoding names) means a new test-*.sh added alongside a
      # future script -- in either directory -- is picked up
      # automatically.
      - name: Run payload self-tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(assets/test-*.sh scripts/test-*.sh)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No assets/test-*.sh or scripts/test-*.sh self-tests found." >&2
            exit 1
          fi
          for t in "${tests[@]}"; do
            echo "::group::${t}"
            bash "${t}"
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Installs the pnpm version `package.json`'s `packageManager` pins.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs every tool mise.toml declares and puts it on PATH.
      - name: Install lint tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Lint
        run: pnpm lint

  # The single required status check. `needs:` every job above and
  # fails when any of them failed, was cancelled, or was skipped — the
  # same aggregate-context convention as this repo's existing required
  # checks (codeql-required, install-gate-required, pinned-gate-required).
  # Registered as a required status check via the repo-level
  # `repo-required-checks` ruleset, NOT via `protect-main`:
  # `protect-main` is converged by this repo's own sweep code
  # (src/converge/ruleset.ts) against the canonical
  # assets/protect-main-ruleset.json using an exact-set compare on
  # required-check contexts, so a hand-added context there would be
  # treated as drift and reverted on the next sweep tick. GitHub
  # aggregates required checks across every active ruleset on a branch,
  # so a check required by either ruleset is required.
  ci-required:
    name: ci-required
    needs: [build-test, payload-self-tests, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Conclude on the dependency jobs' results
        run: |
          results=(
            "${{ needs.build-test.result }}"
            "${{ needs.payload-self-tests.result }}"
            "${{ needs.lint.result }}"
          )
          echo "build-test: ${{ needs.build-test.result }}"
          echo "payload-self-tests: ${{ needs.payload-self-tests.result }}"
          echo "lint: ${{ needs.lint.result }}"
          for r in "${results[@]}"; do
            if [ "${r}" != "success" ]; then
              echo "ci-required aggregator: FAIL — at least one job did not succeed." >&2
              exit 1
            fi
          done
          echo "ci-required aggregator: PASS."
