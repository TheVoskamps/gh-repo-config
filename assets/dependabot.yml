# Dependabot configuration, rendered by renderDependabotYml in
# src/converge/render.ts.
#
# Placeholders:
#
#   __DEFAULT_BRANCH__       Default branch of the target repo. Used as
#                            the `target-branch` for every ecosystem so
#                            Dependabot opens PRs against the right base.
#   __DEPENDABOT_ECOSYSTEMS__  The fully-rendered `updates:` entries for
#                            EVERY supported package ecosystem (one block
#                            per ecosystem — the full armed set, NOT just
#                            the detected ones). Dependabot NO-OPS on an
#                            ecosystem whose manifest is absent, so arming
#                            the full set adds no spurious update PRs — it
#                            just means an ecosystem's first manifest is
#                            covered the moment it lands, with nothing
#                            re-installed. A `dependabot.yml` is therefore
#                            ALWAYS written.
#
# This file is the OUTER template. renderDependabotYml renders one copy
# of the per-ecosystem block (kept in `ecosystem-block.yml` alongside
# this file) for each ecosystem in DEPENDABOT_ECOSYSTEMS, concatenates
# them, and substitutes the result for __DEPENDABOT_ECOSYSTEMS__.
version: 2
updates:
__DEPENDABOT_ECOSYSTEMS__
