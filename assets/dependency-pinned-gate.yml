# Dependency-pinned-gate workflow rendered by /gh-repo-setup-protection.
#
# Installed at <repo-root>/.github/workflows/dependency-pinned-gate.yml
# (alongside its sibling script at
# <repo-root>/.github/scripts/dependency-pinned-gate.sh).
#
# ARMED WITH THE FULL SUPPORTED SET — runtime-gated, fails OPEN. This
# workflow is armed with EVERY supported ecosystem (`npm`, `pip`,
# `actions`, `docker`, `go`) at install time, and decides WHICH to gate
# at RUNTIME, per PR. There is NO detect step here: the single job's one
# check STEP opens by calling `dependency-pinned-gate.sh --present` (the
# SAME `git ls-files` discovery the gate itself uses), which emits a JSON
# array of the ecosystems whose manifest is actually present, and the
# loop further down that same step then checks exactly those. So an
# ecosystem is checked IFF its manifest is in the tree right now:
#   - present + clean          -> that ecosystem passes,
#   - present + floating spec  -> that ecosystem fails (blocking),
#   - absent                   -> NOT checked at all (fails OPEN — no
#                                 phantom check, no empty-green noise).
# `actions` is effectively an always-present floor because the skill
# always installs workflow files. An ecosystem whose manifest lands
# AFTER setup (e.g. the repo's first `go.mod`) is picked up on the next
# PR, with NO skill re-run.
#
# ONE JOB, NOT THREE (issue #77). This workflow used to be a `detect`
# job, a `gate` matrix with one leg per present ecosystem, and an
# `if: always()` `pinned-gate-required` aggregator. GitHub bills a whole
# minute per JOB, rounded up, and each of those jobs did seconds of real
# work: across a measured 3.7-day window the two dependency gates spent
# 324 billable minutes on their `detect` + `*-required` wrapper jobs
# alone. A check NAME is free on GitHub; a JOB is the billing unit. So
# detection is now the head of a run STEP, the per-ecosystem legs are a
# LOOP below it in that same step, and the single remaining job KEEPS the
# name `pinned-gate-required` — the name `protect-main-ruleset.json`
# lists as the required status check, which is therefore unchanged by the
# collapse.
#
# WHY DETECTION IS INLINE HERE BUT ITS OWN STEP IN THE SIBLING GATE. The
# dependency-install-gate keeps a separate `detect` step because its
# `node` / `pip` outputs arm LATER steps (`Set up Node`, `Set up Python`,
# CodeArtifact auth) through step-level `if:` conditions, and an `if:`
# can only read another STEP's outputs. This gate has no such
# conditional steps — `Set up Python` below is unconditional — so its
# `--present` call has nothing to hand across a step boundary and stays
# inline at the head of the check step. Do not "harmonize" the two into
# a detect step here; that would add a step boundary for no consumer.
#
# Every invariant of the previous three-job shape survives: still
# runtime-armed per PR, still fails open when no manifest is present,
# still no phantom check (the job always runs and always concludes, so
# a required check is never left pending — the #91/#230 hang this
# shape's `if: always()` aggregator originally fixed cannot return),
# still no skill re-run when a repo's first `go.mod` lands.
#
# PER-ECOSYSTEM VISIBILITY — the trade-off this collapse makes, and how
# it is paid for. The three-job shape gave each ecosystem its own check
# NAME, so a red `Pinned gate (npm)` named the failing ecosystem in the
# PR's checks list. Collapsed, there is one red `pinned-gate-required`
# and the ecosystem is one click away in the log. That regression is
# deliberately bought back INSIDE the job rather than with extra jobs:
#   - a JOB SUMMARY table lists every checked ecosystem with PASS/FAIL,
#     rendered on the run page with no log-diving at all, and
#   - a `::error title=pinned-gate (<ecosystem>)::` ANNOTATION is
#     emitted per failing ecosystem, which surfaces on the run page
#     and in the PR's Checks tab naming the ecosystem — but NOT on the
#     Files changed tab. An annotation with no `file=` parameter
#     defaults to `file=.github`, `line=1` per GitHub's
#     workflow-command parameter table, so it is attached to no file in
#     the diff and the diff view never shows it. The loop cannot do
#     better: it only ever learns WHICH ecosystem failed, not where.
#     Diff-attached annotations come from the gate script instead —
#     dependency-pinned-gate.sh emits its own
#     `::error file=<manifest>::` per offending manifest, and those DO
#     land on Files changed when the manifest is part of the diff.
# Both are free — annotations and summaries are step output, not jobs.
#
# RUN-ALL-THEN-FAIL. The loop never short-circuits: every present
# ecosystem is checked even after one fails, and the job exits non-zero
# at the end. This preserves the `fail-fast: false` behaviour of the
# matrix it replaces, so one PR iteration surfaces every offending
# ecosystem rather than one per push.
#
# This is the SIBLING of the dependency-install-gate: the install-gate
# protects the lockfile<->manifest *lock* relationship; THIS gate
# protects how the manifest itself DECLARES versions. A package.json with
# "^2.172.0", a requirements.txt with ">=1.40", a workflow
# `uses: actions/checkout@v4`, or a `FROM node:22` resolves to a
# DIFFERENT concrete version over time even when the lockfile is in
# sync -- the "works on main, breaks on rebase" supply-chain drift that
# slips past a green install-gate. The gate fails the PR when any
# DECLARED dependency in any present ecosystem is not pinned to an exact
# version.
#
# Categorical exemptions (legitimately not exact-pinnable) live in the
# sibling script's classifier, NOT a maintained allowlist file:
# npm peerDependencies carets, file:/workspace:/link:/git+ specs, pnpm
# catalog:/catalog:<name> references ONLY ONCE THEY RESOLVE (an
# unresolved reference -- an undefined catalog label, or no covering
# pnpm-workspace.yaml at all -- is a violation, not an exemption; a
# resolved reference's catalog entry in pnpm-workspace.yaml is then
# validated for exactness), engines / requires-python floors,
# overrides/resolutions classified on the override VALUE, and Docker
# `tag@sha256:` digests (the digest is read; the floating tag is
# allowed alongside it). Nested pnpm-workspace.yaml roots are a
# separate, standalone violation. See the script header for the full
# list.
#
# Pin-check ONLY -- there is NO install / build step. The discovery +
# run-all-then-fail + classifier logic lives in the sibling script
# .github/scripts/dependency-pinned-gate.sh.
#
# Hardening invariants (mirror the dependency-install-gate):
#   - Every action is SHA-pinned (a floating @v4/@v5 tag is a supply-
#     chain risk; the trailing comment records the human-readable tag).
#     The gate would flag its own workflow otherwise.
#   - `permissions: contents: read` (least privilege; the gate only
#     reads the tree).
#   - The job checks out github.event.pull_request.head.sha so the
#     gate validates the PR head, not a merge commit.
#
# Placeholders:
#   __DEFAULT_BRANCH__   Default branch of the target repo. The gate
#                        runs on pull_request events targeting it.
#
# There is intentionally NO per-job delimiter-comment rendering: the
# armed set is the full supported set, fixed in this template, and
# narrowed to the present set at RUNTIME by the `--present` call at the
# head of the check step — never at install time.
name: dependency-pinned-gate

on:
  pull_request:
    branches: [__DEFAULT_BRANCH__]

# Least-privilege: the gate only reads the tree to classify declared
# dependency versions. No write scopes are needed.
permissions:
  contents: read

jobs:
  # THE SINGLE JOB, and the single required status check. Detection,
  # every per-ecosystem pin check, and the verdict all happen here; see
  # the "ONE JOB, NOT THREE" note in the header for why. The
  # `protect-main` ruleset lists THIS job's name
  # (`pinned-gate-required`) as the required check.
  pinned-gate-required:
    name: pinned-gate-required
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The gate script parses manifests with python3 (stdlib json +
      # tomllib), so a 3.11+ interpreter is needed for every ecosystem,
      # not just pip. Unconditional and cheap (setup-python is cached on
      # the runner image); the detect call below deliberately runs after
      # it for the same reason.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Exact-version pin check over every present ecosystem
        run: |
          set -euo pipefail

          # `--present` emits a JSON array of the ecosystems whose
          # manifest is in the tracked tree, e.g. ["npm","actions"], or
          # `[]` when none are.
          present="$(bash .github/scripts/dependency-pinned-gate.sh --present)"
          csv="$(printf '%s' "${present}" | tr -d '[]" ')"
          echo "Present ecosystems: ${present}"

          {
            echo "## pinned-gate-required"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

          # Fail OPEN, and do it BEFORE splitting: a manifest-less repo
          # is mergeable, not hung, and the empty case never reaches the
          # loop (which also keeps `"${ecosystems[@]}"` off an unset
          # array under `set -u`).
          if [ -z "${csv}" ]; then
            echo "PASS — no supported ecosystem present in the tracked tree (fail-open)."
            echo "No supported ecosystem is present in the tracked tree; nothing to check (fail-open)." \
              >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Split EXPLICITLY into an array. Relying on the shell's
          # default word splitting of an unquoted expansion works under
          # bash but not under every shell this block might be pasted
          # into, and the failure mode is silent: the loop would run
          # ONCE with "npm actions" as a single word, the script would
          # hit its usage branch, and the required check would go red
          # for a reason that has nothing to do with the repo's pins.
          IFS=',' read -r -a ecosystems <<< "${csv}"

          {
            echo "| ecosystem | result |"
            echo "| --- | --- |"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Run-all-then-fail: never short-circuit, so one PR iteration
          # surfaces every offending ecosystem.
          rc=0
          for ecosystem in "${ecosystems[@]}"; do
            echo "=== pinned-gate: ${ecosystem} ==="
            if bash .github/scripts/dependency-pinned-gate.sh "${ecosystem}"; then
              echo "| \`${ecosystem}\` | PASS |" >> "${GITHUB_STEP_SUMMARY}"
            else
              rc=1
              echo "| \`${ecosystem}\` | **FAIL** |" >> "${GITHUB_STEP_SUMMARY}"
              echo "::error title=pinned-gate (${ecosystem})::Declared dependencies in the ${ecosystem} ecosystem are not all pinned to exact versions. See the \"pinned-gate: ${ecosystem}\" section of this job's log for the offending declarations."
            fi
          done

          if [ "${rc}" -ne 0 ]; then
            echo "pinned-gate: FAIL — at least one present ecosystem has non-exact declarations." >&2
          else
            echo "pinned-gate: PASS — every present ecosystem is exact-pinned."
          fi
          exit "${rc}"
