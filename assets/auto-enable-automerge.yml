# Template for /gh-repo-setup-pr-automation. Rendered into the target
# repo at .github/workflows/auto-enable-automerge.yml.
#
# Placeholders (see the github-setup plugin payload README for the convention):
#   __DEFAULT_BRANCH__   default branch PRs target (e.g. main)
#   __APP_NAME__         GitHub App slug used for automation
#   __APP_CLIENT_ID_SECRET__  ORG secret, visible to all repositories,
#                        holding the App Client ID, present in BOTH the
#                        Actions and the Dependabot secret store
#                        (e.g. AUTOMERGE_APP_CLIENT_ID)
#   __APP_PRIVATE_KEY_SECRET__  secret holding the App private key, at
#                        repo or org scope — secrets.<NAME> resolves
#                        either (e.g. AUTOMERGE_APP_PRIVATE_KEY)
#   __MERGE_METHOD__     GraphQL merge method: MERGE | SQUASH | REBASE
#   __DO_NOT_MERGE_LABEL__  label that opts a PR out of automation
name: auto-enable-automerge
on:
  pull_request:
    # ready_for_review is silently swallowed by GitHub when the PR is
    # CONFLICTING/DIRTY at the moment it goes ready: `pull_request` runs
    # against the PR's test-merge commit, and GitHub does not create a
    # run at all for a conflicting PR
    # (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows).
    # A PR that was marked ready while conflicting therefore never
    # re-enables auto-merge from ready_for_review alone. synchronize is
    # the re-arm path: once the author pushes a conflict resolution, the
    # push fires synchronize (not ready_for_review), and the
    # `draft == false` job guard plus the enable-automerge job's
    # autoMergeRequest.enabledAt idempotency pre-check make every other
    # synchronize (draft or already-enabled) a cheap no-op.
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [__DEFAULT_BRANCH__]

# ONE JOB, ON ONE EVENT (issue #77). This workflow used to carry a
# second job, `dependabot-rest-merge`, on `workflow_run` /
# `workflow_dispatch` / a daily `schedule`. That job fired on the SAME
# workflow_run event as auto-rebase-prs.yml's rebase sweep and did the
# complementary half of the same work -- rebase, then merge -- so one
# logical sweep cost two billable jobs: 699 billable minutes for 148
# minutes of real work in a measured 3.7-day window. It now lives as a
# step of auto-rebase-prs.yml's single job, which also removes the race
# where a merge sweep evaluated a head the rebase sweep was mid-rewrite
# of. See that workflow's header for the moved pass and its security
# boundary.
#
# The two workflows were NOT collapsed into one FILE: the converger has
# no delete-a-file path, so retiring a rendered workflow would leave an
# orphan copy running, and billing, on every managed repo. The split is
# now by EVENT instead: everything `pull_request` stays here, everything
# the sweep does happens there.
#
# WHAT REMAINS HERE: enable-automerge -- runs on pull_request
# opened/reopened/ready_for_review/synchronize. Enables GitHub's native
# auto-merge on every PR to __DEFAULT_BRANCH__ so the PR merges
# automatically once required checks + approvals are green. This is the
# path for HUMAN PRs: native auto-merge waits for the full ruleset
# (review + code-owner + status checks) to be genuinely satisfied, so a
# human change to a code-owned path still needs its code-owner. A
# Dependabot PR on a code-owned path cannot merge by this path (native
# `--auto` does not engage the App's bypass actor); that is exactly what
# the moved REST-merge pass is for.
#
# Auth: this job MUST run as the GitHub App "__APP_NAME__", not the
# default GITHUB_TOKEN. The default token integration cannot call
# enablePullRequestAutoMerge ("FORBIDDEN: Resource not accessible by
# integration").
#
# The workflow consumes two secrets: __APP_CLIENT_ID_SECRET__, an ORG
# secret visible to all repositories, and __APP_PRIVATE_KEY_SECRET__,
# which may sit at repo or org scope. A short-lived installation token
# is minted at
# workflow runtime by actions/create-github-app-token, which signs a JWT
# with the private key and exchanges it for an installation access token
# via the App's installation endpoint. There is no long-lived "App token"
# to store; the canonical pattern is App Client ID + private key in
# secrets, token minted per-run. Only __APP_PRIVATE_KEY_SECRET__ is seeded
# by /gh-repo-setup-pr-automation; that skill seeds the App's numeric ID,
# which client-id: cannot consume, so __APP_CLIENT_ID_SECRET__ is set by
# hand, and must be set at ORG scope with all-repositories visibility:
# this template fans out to every managed repo, so a repo-scoped copy
# would have to be provisioned again on each one. It must be set that
# way in BOTH org secret stores, the Actions one and the Dependabot one.
# This workflow runs on pull_request, which includes Dependabot's own
# PRs, and a run triggered by a Dependabot PR resolves secrets.* from
# the Dependabot store rather than the Actions store, so a copy in only
# one store leaves one class of runs unable to mint.
# Without them, actions/create-github-app-token fails fast with a clear
# error, which is the intended behaviour: do NOT fall back to GITHUB_TOKEN.
#
# Serialize runs so concurrent passes do not race on a mutation. Keyed on
# PR number, which every event this workflow now listens for carries
# (close-spaced opened -> ready_for_review on one PR must not overlap,
# while two different PRs need not wait on each other). The
# `|| github.workflow` fallback is kept as a belt-and-braces default for
# any event that somehow arrives without a `pull_request` payload; with
# the sweep triggers moved out (issue #77, see header) nothing reaches it
# in normal operation. cancel-in-progress: false so each event is
# processed in order; the enabledAt idempotency guard in the job makes a
# repeat run a no-op.
concurrency:
  group: auto-enable-automerge-${{ github.event.pull_request.number || github.workflow }}
  cancel-in-progress: false

# The privileged work uses an installation token minted at runtime from
# __APP_CLIENT_ID_SECRET__ + __APP_PRIVATE_KEY_SECRET__ by
# actions/create-github-app-token (see header comment), not the default
# GITHUB_TOKEN. This permissions block governs only the default
# GITHUB_TOKEN, which no step here reads. contents: read is the
# conventional minimum in case a future step adds actions/checkout or reads
# repo metadata via the default token. pull-requests: write is
# intentionally NOT granted -- the App's installation token authorises the
# mutation.
permissions:
  contents: read

jobs:
  enable-automerge:
    # Native-auto-merge path for ALL PRs (human and Dependabot alike),
    # and now the only job in this workflow (issue #77 -- see header).
    # The `github.event_name == 'pull_request'` clause is redundant with
    # the trigger list above now that the sweep triggers have moved out,
    # and is kept deliberately: it is what makes this job safe if a
    # non-pull_request trigger is ever added back, since every other
    # clause below reads a `github.event.pull_request` field that would
    # then be absent.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, '__DO_NOT_MERGE_LABEL__')
    runs-on: ubuntu-latest
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.__APP_CLIENT_ID_SECRET__ }}
          private-key: ${{ secrets.__APP_PRIVATE_KEY_SECRET__ }}
      - name: Enable auto-merge with custom commit message
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Idempotency guard: skip when auto-merge is already enabled on
          # this PR. The pull_request `reopened` event fires after a
          # reopen-after-close, and a second enablePullRequestAutoMerge
          # mutation on a PR that already has auto-merge enabled returns
          # an error, producing a noisy red workflow run. Pre-check
          # autoMergeRequest.enabledAt instead.
          ENABLED_AT=$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$num:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$num) {
                  autoMergeRequest { enabledAt }
                }
              }
            }' \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            -F num="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.autoMergeRequest.enabledAt')
          if [ -n "$ENABLED_AT" ] && [ "$ENABLED_AT" != "null" ]; then
            echo "auto-merge already enabled at ${ENABLED_AT}, skipping"
            exit 0
          fi
          HEADLINE="Merge PR: ${PR_TITLE} (#${PR_NUMBER})"
          # GitHub caps commit messages at 16383 chars. A large grouped
          # Dependabot PR body (release notes x N, itself already capped
          # at Dependabot's 64K body limit) can blow past that, which
          # would otherwise fail this mutation with "Commit message is
          # too long" and, worse, poison the Dependabot REST-merge
          # pass's candidate gate over in auto-rebase-prs.yml (this
          # job's failed check run drags statusCheckRollup.state away
          # from SUCCESS). Truncate at 16000 chars (headroom under 16383
          # for the marker line, the URL, and the joining newlines) and
          # append the PR URL so the untruncated body is always
          # reachable. Bodies under the cap pass through unchanged.
          BODY="${PR_BODY:-}"
          if [ "${#BODY}" -gt 16000 ]; then
            BODY="${BODY:0:16000}"$'\n\n'"[TRUNCATED — full description: ${PR_URL}]"
          fi
          # GraphQL enablePullRequestAutoMerge: commitHeadline /
          # commitBody set the merge commit message.
          gh api graphql \
            -f query='mutation($prId: ID!, $headline: String!, $body: String!) {
              enablePullRequestAutoMerge(input: {
                pullRequestId: $prId,
                mergeMethod: __MERGE_METHOD__,
                commitHeadline: $headline,
                commitBody: $body
              }) {
                pullRequest { number autoMergeRequest { enabledAt } }
              }
            }' \
            -f prId="$PR_NODE_ID" \
            -f headline="$HEADLINE" \
            -f body="$BODY"
