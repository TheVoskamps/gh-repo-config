# Template for /gh-repo-setup-pr-automation. Rendered into the target
# repo at .github/workflows/auto-rebase-prs.yml.
#
# Placeholders (see the github-setup plugin payload README for the convention):
#   __DEFAULT_BRANCH__   default branch PRs target (e.g. main)
#   __APP_NAME__         GitHub App slug used for automation
#   __APP_CLIENT_ID_SECRET__  ORG secret, visible to all repositories,
#                        holding the App Client ID, present in BOTH the
#                        Actions and the Dependabot secret store
#                        (e.g. AUTOMERGE_APP_CLIENT_ID)
#   __APP_PRIVATE_KEY_SECRET__  secret holding the App private key, at
#                        repo or org scope — secrets.<NAME> resolves
#                        either (e.g. AUTOMERGE_APP_PRIVATE_KEY)
#   __BOT_SLUG__         git identity used for rebase commits, e.g.
#                        "<repo>-auto-rebase[bot]"
#   __REQUIRED_CHECK_WORKFLOW__  name of the repo's required-check
#                        workflow that, on completion, should trigger a
#                        rebase pass (e.g. no-back-merging-guard). If the
#                        repo has no such workflow, the
#                        /gh-repo-setup-pr-automation skill drops this
#                        workflow_run trigger when rendering.
#   __DO_NOT_MERGE_LABEL__  label that opts a PR out of automation
#   __REST_MERGE_METHOD__  REST merge method (lowercase): merge | squash
#                        | rebase. Used by the Dependabot REST-merge
#                        pass below.
#   __INSTALL_GATE_WORKFLOW__  name of the dependency-install-gate
#                        workflow whose failing check signals a
#                        lockfile desync (e.g. dependency-install-gate).
#                        Drives the #1218 lockfile-regen pass below. If
#                        the repo has no such workflow, the
#                        /gh-repo-setup-pr-automation skill drops the
#                        lockfile-regen step (and the auto-rebase-lockfile-
#                        regen.sh script) when rendering.
#   __INSTALL_GATE_CHECK__  name of the CheckRun within
#                        __INSTALL_GATE_WORKFLOW__ that fails on a lockfile
#                        desync (e.g. install-gate-required).
name: auto-rebase-prs
on:
  push:
    branches: [__DEFAULT_BRANCH__]
  workflow_run:
    workflows: [__REQUIRED_CHECK_WORKFLOW__]
    types: [completed]
  workflow_dispatch:
  schedule:
    # TWO BACKSTOPS, TWO RATIONALES, ONE CRON LIST. This job runs the
    # rebase sweep AND the Dependabot REST-merge sweep (see the header),
    # and the two do not want the same schedule. Keep the reasons
    # separate: collapsing them is how the merge pass lost its weekend
    # coverage when issue #77 first moved it in here.
    #
    # (a) REBASE BACKSTOP -- Pacific WEEKDAY business hours only.
    #     What it is for: mergeStateStatus is computed lazily by GitHub.
    #     Right after a push to __DEFAULT_BRANCH__, open PRs are
    #     reported UNKNOWN until a background recompute settles them to
    #     BEHIND, and the event-driven runs above can drop a genuinely
    #     behind PR because of that race. A cron tick re-enumerates
    #     fresh state and catches any PR the race skipped. That is ALL
    #     it is for -- push, workflow_run, issue_comment and
    #     workflow_dispatch do the real work.
    #     Why it is windowed (issue #77): `*/20 * * * *` is 2,160 ticks
    #     per repo per month. Each does ~16 seconds of work and is
    #     billed a whole minute, which came to 406 billable minutes in a
    #     measured 3.7-day window for 103 minutes of real work. THIS
    #     race only matters while someone is actually pushing, so
    #     ticking through the night and the weekend buys nothing FOR
    #     THIS BACKSTOP. (It buys something for (b) -- hence (b).)
    #
    # (b) MERGE BACKSTOP -- a WEEKEND tick, Saturday and Sunday.
    #     What it is for: the REST-merge pass's own backstop, which was
    #     `0 12 * * *` in auto-enable-automerge.yml before issue #77
    #     moved that pass into this job. It catches a dropped
    #     workflow_run completion event, or a PR that went green with no
    #     event firing at all. Dependabot opens PRs on ITS schedule, not
    #     on the team's, and their checks go green whenever they go
    #     green -- weekends included -- so (a)'s "nobody is pushing"
    #     reasoning does NOT transfer to the merge pass. On (a)'s
    #     entries alone the longest gap between ticks is Sat 02:00 UTC
    #     -> Mon 15:00 UTC, 2 days 13 hours, and a Dependabot PR that
    #     went green on Friday evening would sit unmerged until Monday.
    #     Why 15:00 UTC on Sat+Sun specifically: that is the hour (a)'s
    #     weekday window opens, so the whole week comes out with no gap
    #     longer than 24 hours (Sat 02:00 -> Sat 15:00 is 13h; Sat 15:00
    #     -> Sun 15:00 and Sun 15:00 -> Mon 15:00 are 24h each) -- the
    #     same maximum the old daily `0 12 * * *` guaranteed, for two
    #     extra ticks a week.
    #     A weekend tick runs the WHOLE job, so the rebase sweep runs
    #     then too. That is harmless: every pass here is idempotent and
    #     a no-op when no PR is behind or gate-red.
    #
    # DST CHOICE (applies to (a)): UNION OF PDT AND PST, i.e. slight
    # over-coverage rather than a single-offset anchor. GitHub cron is
    # UTC-only with no timezone support, so a Pacific window drifts an
    # hour across DST and something has to give. Anchoring on one offset
    # is exact for eight months and an hour wrong for four -- and wrong
    # in the direction that clips a real working hour. The union is
    # never wrong in that direction; it just runs one extra hour,
    # whichever side of DST we are on. That is 12 ticks a weekday
    # instead of 72 a day.
    #
    # The arithmetic, for Pacific 08:00-18:00 local, Mon-Fri:
    #   PDT (UTC-7): 08:00 -> 15:00 UTC, 18:00 -> 01:00 UTC next day
    #   PST (UTC-8): 08:00 -> 16:00 UTC, 18:00 -> 02:00 UTC next day
    # The union is 15:00 UTC through 02:00 UTC the following day, which
    # splits across the UTC date boundary and so needs two entries. The
    # day-of-week fields differ accordingly: the 15:00-23:00 hours fall
    # on the local weekday itself (Mon-Fri = 1-5), the 00:00-02:00 hours
    # fall on the following UTC day (Tue-Sat = 2-6). Under PDT the
    # window runs 08:00-19:00 local; under PST, 07:00-18:00 local.
    - cron: '0 15-23 * * 1-5'  # (a) weekday window, local-day hours
    - cron: '0 0-2 * * 2-6'    # (a) same window, past the UTC date line
    - cron: '0 15 * * 0,6'     # (b) merge backstop, Sun (0) + Sat (6)
  issue_comment:
    types: [created]

# Automatically rebase open PRs targeting __DEFAULT_BRANCH__ whenever
# they fall behind. Feature branches must rebase onto the base branch
# (never back-merge), so this workflow performs that rebase as soon as a
# PR's checks complete or as soon as the base branch advances.
#
# Triggers:
#   - push to __DEFAULT_BRANCH__ -- every advance rebases eligible PRs
#   - workflow_run on __REQUIRED_CHECK_WORKFLOW__ completion -- as soon
#     as a PR's required check finishes, the rebase pass runs
#   - workflow_dispatch -- manual "Run workflow" button (or
#     `gh workflow run auto-rebase-prs.yml`). Recovery path for the
#     lazy-mergeStateStatus race. Sweeps all eligible PRs.
#   - schedule -- periodic backstop sweep, for two distinct reasons the
#     `on: schedule:` block keeps apart: a window over Pacific weekday
#     business hours so a PR that was UNKNOWN at push time is rebased on
#     the next tick, plus a Saturday+Sunday tick so the REST-merge pass
#     below keeps the weekend dropped-event backstop it had as its own
#     daily cron before it moved into this job. Sweeps all eligible PRs.
#   - issue_comment (created) -- a collaborator comments `/rebase` on a
#     PR to rebase just that PR (the generic equivalent of
#     `@dependabot rebase`). Gated to PR comments from users with write
#     access; scoped to the single commenting PR rather than sweeping.
#
# THIS WORKFLOW ALSO CARRIES THE DEPENDABOT REST-MERGE SWEEP (issue
# #77). It used to live in auto-enable-automerge.yml, whose
# `dependabot-rest-merge` job fired on the SAME workflow_run event as
# this workflow's rebase pass and did the complementary half of the same
# work: rebase, then merge. Two jobs on one event is two billable
# minutes for a few seconds of work each -- 699 billable minutes for 148
# minutes of real work in a measured 3.7-day window. They are now one
# job here, which also removes the race where a merge sweep evaluated a
# head the rebase sweep was mid-rewrite of: the two passes are steps in
# a fixed order under one concurrency group instead of two workflows
# racing.
#
# The two files were NOT merged into one, deliberately:
# auto-enable-automerge.yml keeps its `pull_request` path (enabling
# native auto-merge on every PR), because the converger has no
# delete-a-file path -- retiring a rendered workflow would leave an
# orphan copy running, and billing, on every managed repo. So the split
# is now by EVENT rather than by file: `pull_request` work stays there,
# and everything the `workflow_run` / `workflow_dispatch` / `schedule`
# sweep does happens here, in one job. Their concurrency groups needed
# no reconciliation as a result: this workflow's flat `auto-rebase-prs`
# group now serializes rebase against merge (which is what we want --
# they are sequential complementary work), and
# auto-enable-automerge.yml's per-PR group is now only ever evaluated on
# a `pull_request` event, where the PR number it keys on always exists.
#
# For the `/rebase` slash command (issue_comment trigger) only the
# single commenting PR is considered, and the comment author must have
# write (or admin) permission on THIS repo so arbitrary commenters
# cannot trigger a force-push. Authorization is enforced in two stages:
# the job-level `if:` below applies the cheap event-payload pre-filters
# (the comment is on a PR and the body contains `/rebase`), and an early
# "Authorize /rebase commenter" step queries the authoritative
# repository-permission API
# (`repos/<owner>/<repo>/collaborators/<user>/permission`) and exits the
# job unless the result is `admin` or `write`. The job-level `if:` alone
# is insufficient: `author_association` describes the commenter's
# relationship to the org/repo (OWNER / MEMBER / COLLABORATOR), NOT their
# effective permission on this repo -- an org MEMBER or a COLLABORATOR
# can be read-only, yet would pass an association-based gate. The
# permission API is the only authoritative source for "can this user
# push here", and it can only be queried at runtime (the event payload
# does not carry it), so it cannot live in the job-level `if:`. For all
# other triggers the job sweeps every eligible PR.
#
# Per-PR rules (sweep path):
#   1. Skip if PR is in draft state.
#   2. Skip if PR carries the `__DO_NOT_MERGE_LABEL__` label (escape
#      hatch).
#   3. Skip Dependabot-authored PRs (author.login == "dependabot") that
#      Dependabot still manages, UNLESS a non-Dependabot actor has
#      already pushed to the branch. "Still managed" is read from the
#      HEAD commit author login: it equals `dependabot[bot]` while
#      Dependabot owns the PR and changes once a human pushes. Rebasing a
#      managed Dependabot PR breaks Dependabot's management (it will no
#      longer recreate/supersede/auto-update it) and re-triggers every
#      required check for nothing; once a human has pushed, Dependabot has
#      already stopped managing it, so the exclusion lifts and the PR is
#      rebased like any human PR. This exclusion is scoped to ROUTINE
#      behind-main rebasing; the lockfile-regen pass below is EXEMPT and
#      acts on Dependabot PRs too. The explicit `/rebase` slash command
#      (issue_comment path) also bypasses this exclusion -- it is a
#      deliberate human override.
#   4. Only act on PRs whose mergeStateStatus is BEHIND or BLOCKED --
#      the two states that can mean "behind the base branch". BLOCKED is
#      overloaded (it can also mean missing review or failing checks),
#      so we additionally short-circuit with `git merge-base
#      --is-ancestor origin/__DEFAULT_BRANCH__ <head>` to skip BLOCKED
#      PRs that aren't actually behind.
#   5. Attempt a rebase onto origin/__DEFAULT_BRANCH__. If clean,
#      force-push with --force-with-lease so concurrent author pushes
#      are not clobbered.
#   6. If the rebase produces conflicts, abort and leave the PR alone.
#      No comment, no failure; the PR author handles it.
#
# Lockfile-regen pass, a SEPARATE pass after the rebase sweep:
#   The dominant Dependabot failure is not a real conflict -- it is a
#   manifest bumped but its npm lockfile not regenerated to match, which
#   fails the dependency-install-gate (its `__INSTALL_GATE_CHECK__`
#   check). That check is the install gate's single required-check job,
#   so it goes red for a drift in ANY package manager, not just npm; the
#   regen script re-confirms below that the failure really is a
#   lockfile-only npm desync before touching anything, so keying on the
#   aggregate check is a widened pre-filter and never a widened action.
#   This pass detects a PR whose
#   `__INSTALL_GATE_WORKFLOW__ / __INSTALL_GATE_CHECK__` check is
#   FAILING, checks out its head, and runs
#   `.github/scripts/auto-rebase-lockfile-regen.sh`, which acts ONLY when
#   the desync is lockfile-only: it regenerates each desynced lockfile
#   with `npm install --package-lock-only --ignore-scripts` and verifies
#   the result replays under `npm ci --ignore-scripts`. If a regen
#   succeeds, this workflow commits the lockfile(s) and force-pushes with
#   --force-with-lease; the push re-runs the install gate (and any build
#   gate) on the corrected commit, and THAT re-run is the verification --
#   a bad regen stays red rather than merging. If the gate-red is
#   anything other than a fixable lockfile-only desync (an unsatisfiable
#   manifest, a pip pin conflict), the script leaves the PR for a human.
#
#   This pass is EXEMPT from the Dependabot-author exclusion above: it
#   acts on ANY author INCLUDING Dependabot, because Dependabot caused
#   the desync and cannot regenerate the lockfile itself. The two paths
#   are deliberately distinct: routine behind-main rebase skips
#   Dependabot; gate-red-from-lockfile-desync regen acts on every author.
#   pip is out of scope (a pip gate failure is an unresolvable pin set,
#   not a lockfile-only desync -- see the script header).
#
# Auth: this workflow MUST run as the GitHub App "__APP_NAME__", not as
# the default GITHUB_TOKEN. A push made with GITHUB_TOKEN does NOT
# re-trigger downstream workflows (GitHub design, to prevent infinite
# recursion). After an auto-rebase push, the PR's required status checks
# would not re-run, leaving stale results and breaking the "rebase keeps
# the PR mergeable" loop. Pushing as a GitHub App makes the push look
# like an external actor, so the checks do re-run. Do NOT fall back to
# GITHUB_TOKEN.
#
# The workflow consumes two secrets: __APP_CLIENT_ID_SECRET__, an ORG
# secret visible to all repositories, and __APP_PRIVATE_KEY_SECRET__,
# which may sit at repo or org scope. A short-lived installation token
# is
# minted at runtime by actions/create-github-app-token (see the first
# job step); there is no long-lived stored token.
# Only __APP_PRIVATE_KEY_SECRET__ is seeded by
# /gh-repo-setup-pr-automation; that skill seeds the App's numeric ID,
# which client-id: cannot consume, so __APP_CLIENT_ID_SECRET__ is set by
# hand, and must be set at ORG scope with all-repositories visibility:
# this template fans out to every managed repo, so a repo-scoped copy
# would have to be provisioned again on each one. It must be set that
# way in BOTH org secret stores, the Actions one and the Dependabot one;
# auto-enable-automerge.yml's header states why, and that requirement is
# on the secret itself, so it holds wherever the secret is read from.
# Until the App is provisioned the first workflow run fails fast at the
# token-mint step with a clear error from
# actions/create-github-app-token; that failure is intended.

# All privileged git and API operations below run with a GitHub App
# installation token minted at runtime by actions/create-github-app-token
# from __APP_CLIENT_ID_SECRET__ and __APP_PRIVATE_KEY_SECRET__,
# not the default GITHUB_TOKEN. The block below therefore only governs
# any implicit GITHUB_TOKEN usage (e.g. inside actions/checkout when no
# explicit token is passed). actions/checkout here is given the minted
# App token explicitly, so no contents: write is needed; keep the block
# minimal and let the App's installation permissions govern the work.
permissions: {}

# A single flat group: every trigger here sweeps the whole eligible PR
# set rather than acting on one PR, so one run at a time is exactly
# right, and no event this workflow listens for carries a
# `pull_request` payload to key a per-PR group on anyway. Since the
# Dependabot REST-merge pass moved into this job (issue #77, see the
# header), this group additionally serializes merging against rebasing
# -- the two used to be separate workflows with separate groups, which
# let a merge sweep evaluate a head the rebase sweep was mid-rewrite of.
# cancel-in-progress: false so each event is processed in order; the
# idempotency guards in every pass make a repeat run a no-op.
concurrency:
  group: auto-rebase-prs
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    # For issue_comment, only run when the comment is on a PR (not a
    # plain issue) and the body contains `/rebase`. These are the cheap
    # event-payload pre-filters only; the authoritative write/admin
    # permission check on THIS repo cannot be expressed here (the event
    # payload does not carry effective repo permission -- only
    # `author_association`, which is not the same thing) and is enforced
    # at runtime by the "Authorize /rebase commenter" step below. All
    # other triggers (push, workflow_run, workflow_dispatch, schedule)
    # run unconditionally. `contains` matches `/rebase` anywhere in the
    # body; the rebase-step parse below tightens this to a line that is
    # exactly `/rebase` so quoting the command in prose does not fire.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/rebase'))
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.__APP_CLIENT_ID_SECRET__ }}
          private-key: ${{ secrets.__APP_PRIVATE_KEY_SECRET__ }}

      # Authoritative authorization for the `/rebase` slash command. The
      # job-level `if:` only confirmed the comment is on a PR and contains
      # `/rebase`; it can NOT confirm the commenter may push to this repo.
      # `author_association` (the only relationship the event payload
      # carries) describes the commenter's tie to the org/repo, not their
      # effective permission: an org MEMBER or a COLLABORATOR can be
      # read-only and would still pass an association-based gate. Query the
      # repository-permission API instead, which returns the effective
      # permission on THIS repo (admin | write | read | none), and exit the
      # job unless it is admin or write. This runs before any git fetch /
      # rebase / force-push work below. The lookup uses the App
      # installation token (same GH_TOKEN the rest of the workflow uses),
      # consistent with the App-token auth model -- the default
      # GITHUB_TOKEN is intentionally not used. Skipped for all non-comment
      # triggers (push / workflow_run / workflow_dispatch / schedule),
      # which sweep all eligible PRs and carry no commenter to authorize.
      - name: Authorize /rebase commenter
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          PERMISSION=$(gh api \
            "repos/${REPO}/collaborators/${COMMENTER}/permission" \
            --jq '.permission')
          echo "Commenter @${COMMENTER} has '${PERMISSION}' permission on ${REPO}"
          case "$PERMISSION" in
            admin|write)
              echo "Authorized: @${COMMENTER} may trigger /rebase."
              ;;
            *)
              echo "::error::@${COMMENTER} has '${PERMISSION}' permission on ${REPO}; /rebase requires admin or write. Refusing to force-push."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "__BOT_SLUG__"
          git config user.email "__BOT_SLUG__@users.noreply.github.com"

      # Needed by the lockfile-regen pass below (`npm ci` / `npm install
      # --package-lock-only`). Pinned to node 22 to match the
      # dependency-install-gate job's own `Set up Node`, so the regen
      # replays the lockfile the same way the gate will after the
      # force-push.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Rebase eligible PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          BASE_BRANCH: __DEFAULT_BRANCH__
        run: |
          set -euo pipefail

          # Always rebase against the latest origin/$BASE_BRANCH.
          git fetch origin "$BASE_BRANCH"

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # The `/rebase` slash command (issue_comment) scopes the pass
          # to the single commenting PR; every other trigger sweeps all
          # open PRs. Both paths feed the same eligibility filter and
          # per-PR rebase loop below -- only the GraphQL node set differs.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            # The job-level `if:` already verified the comment is on a PR
            # and contains `/rebase`, and the "Authorize /rebase commenter"
            # step above verified the commenter has admin/write permission
            # on this repo. Tighten the body match here: require a line
            # that is exactly `/rebase` (allowing surrounding whitespace)
            # so the command quoted inside prose does not fire.
            if ! printf '%s' "$COMMENT_BODY" | grep -qE '^[[:space:]]*/rebase[[:space:]]*$'; then
              echo "Comment does not contain a standalone /rebase command; nothing to do."
              exit 0
            fi
            echo "Slash command /rebase on PR #$COMMENT_PR_NUMBER"
            # Query just the commenting PR. Same field set as the sweep
            # query so the jq filter and loop are reused unchanged.
            PRS_JSON=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    number
                    isDraft
                    mergeStateStatus
                    headRefName
                    headRepositoryOwner { login }
                    baseRefName
                    author { login }
                    commits(last: 1) {
                      nodes { commit { author { user { login } } } }
                    }
                    labels(first: 50) { nodes { name } }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F number="$COMMENT_PR_NUMBER")

            # Reshape `pullRequest` (single object) into the same
            # `pullRequests.nodes[]` array shape the sweep query returns,
            # and drop it if it does not target the base branch (the slash
            # command can land on any PR). The mergeStateStatus filter is
            # NOT applied here: an explicit `/rebase` should rebase even a
            # CLEAN PR if it is behind the base, and the `is-ancestor`
            # short-circuit in the loop already skips PRs not behind base.
            #
            # The Dependabot-author exclusion (applied in the sweep jq
            # filter below) is deliberately NOT applied here: `/rebase` is
            # an explicit human override and MUST act on a Dependabot PR
            # too. The `author` / `commits` fields are fetched so the field
            # set stays parallel with the sweep query, but this jq filter
            # omits the author `select(...)`.
            mapfile -t CANDIDATES < <(echo "$PRS_JSON" | jq -r --arg base "$BASE_BRANCH" '
              .data.repository.pullRequest
              | select(. != null)
              | select(.baseRefName == $base)
              | select(.isDraft == false)
              | select([.labels.nodes[].name] | index("__DO_NOT_MERGE_LABEL__") | not)
              | "\(.number)\t\(.headRefName)\t\(.headRepositoryOwner.login)"
            ')
          else
            # Enumerate open non-draft PRs targeting the base branch.
            # mergeStateStatus is returned via GraphQL; the REST
            # `gh pr list` does not surface it. Only act on PRs whose
            # mergeStateStatus is BEHIND or BLOCKED -- the two states that
            # can mean "branch is behind base". BEHIND is unambiguous.
            # BLOCKED is overloaded (it can mean behind, or missing review,
            # or failing checks, etc.), so we additionally short-circuit at
            # the rebase step with `git merge-base --is-ancestor` to skip
            # BLOCKED PRs that are not actually behind. Other states are
            # dropped here: CLEAN/UNSTABLE are already up-to-date, DIRTY is
            # a GitHub-visible merge conflict (rebase would just abort),
            # HAS_HOOKS / UNKNOWN are out of scope.
            PRS_JSON=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $base: String!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: OPEN, first: 100, baseRefName: $base) {
                    nodes {
                      number
                      isDraft
                      mergeStateStatus
                      headRefName
                      headRepositoryOwner { login }
                      author { login }
                      commits(last: 1) {
                        nodes { commit { author { user { login } } } }
                      }
                      labels(first: 50) { nodes { name } }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -f base="$BASE_BRANCH")

            # Exclude Dependabot-authored PRs from routine behind-main
            # rebasing UNLESS a non-Dependabot actor has already pushed to
            # the branch. Rationale: while Dependabot still owns the PR,
            # force-pushing a rebase (a) makes Dependabot stop managing the
            # PR (it will no longer recreate/supersede/auto-update it) and
            # (b) re-triggers every required check for no benefit. Once a
            # human has pushed, Dependabot has ALREADY stopped managing the
            # PR, so the PR now needs rebasing like any human PR and the
            # exclusion lifts.
            #
            # Detection: a Dependabot PR has `author.login == "dependabot"`.
            # "Has a non-Dependabot actor pushed" is read from the HEAD
            # commit author login: Dependabot authors its commits as
            # `dependabot[bot]` (note the differing form -- the PR author is
            # `dependabot`, the commit author is `dependabot[bot]`), and that
            # author login survives our own auto-rebase force-push (which
            # only rewrites the committer, not the author). So the PR is
            # still Dependabot-managed iff the head commit author is
            # `dependabot[bot]`; any other value (a human login, or a null
            # `user` for an unmapped email) means a non-Dependabot push and
            # the PR is no longer excluded.
            #
            # IMPORTANT: this exclusion is scoped to routine behind-main
            # rebasing. The lockfile-regen pass below is EXEMPT and must act
            # regardless of author, including on Dependabot PRs --
            # Dependabot caused the lockfile desync and cannot get us out of
            # it. That pass layers on top of this filter with the exemption
            # made explicit; do not fold it into this select.
            mapfile -t CANDIDATES < <(echo "$PRS_JSON" | jq -r '
              .data.repository.pullRequests.nodes[]
              | select(.isDraft == false)
              | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "BLOCKED")
              | select([.labels.nodes[].name] | index("__DO_NOT_MERGE_LABEL__") | not)
              | select(
                  (.author.login != "dependabot")
                  or
                  ((.commits.nodes[0].commit.author.user.login // "") != "dependabot[bot]")
                )
              | "\(.number)\t\(.headRefName)\t\(.headRepositoryOwner.login)"
            ')
          fi

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "No eligible PRs to rebase."
            exit 0
          fi

          for line in "${CANDIDATES[@]}"; do
            PR_NUMBER=$(echo "$line" | cut -f1)
            HEAD_REF=$(echo "$line" | cut -f2)
            HEAD_OWNER=$(echo "$line" | cut -f3)

            # Skip fork PRs -- we cannot push to a fork from this token.
            if [ "$HEAD_OWNER" != "$OWNER" ]; then
              echo "PR #$PR_NUMBER: skipping (head is a fork: $HEAD_OWNER)"
              continue
            fi

            echo "PR #$PR_NUMBER: attempting rebase of $HEAD_REF onto origin/$BASE_BRANCH"

            # Use an explicit refspec to avoid the ambiguity of
            # `git fetch origin "$HEAD_REF"`: if a tag in the repo happens
            # to share the branch name, the bare form silently fetches the
            # tag instead of the branch.
            git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
            EXPECTED_SHA=$(git rev-parse "origin/$HEAD_REF")

            # mergeStateStatus=BLOCKED is overloaded: it can mean behind,
            # or missing review, or failing checks. Short-circuit with the
            # cheap O(1) ancestry check so we skip BLOCKED PRs that aren't
            # actually behind the base branch (no rebase, no force-push,
            # nothing). BEHIND PRs always fail this check, so this only
            # filters the BLOCKED-but-up-to-date case.
            if git merge-base --is-ancestor "origin/$BASE_BRANCH" "$EXPECTED_SHA"; then
              echo "PR #$PR_NUMBER: not behind $BASE_BRANCH, skipping rebase"
              continue
            fi

            # Detach onto the PR head so we can rebase without claiming the
            # branch ref locally. --no-track keeps origin tracking
            # untouched on the resulting branch.
            git checkout -B "auto-rebase-$PR_NUMBER" --no-track "origin/$HEAD_REF"

            if git rebase "origin/$BASE_BRANCH"; then
              # --force-with-lease=<ref>:<expected> rejects the push if a
              # concurrent author push has moved origin/$HEAD_REF since we
              # read it, instead of clobbering their work.
              if git push --force-with-lease="$HEAD_REF:$EXPECTED_SHA" origin "HEAD:refs/heads/$HEAD_REF"; then
                echo "PR #$PR_NUMBER: rebased and force-pushed"
              else
                echo "PR #$PR_NUMBER: push rejected (lease lost or auth); skipping"
              fi
            else
              echo "PR #$PR_NUMBER: rebase produced conflicts; aborting and skipping"
              git rebase --abort || true
            fi

            # Return to a detached state so the next iteration's checkout
            # does not collide on the branch name.
            git checkout --detach
            git branch -D "auto-rebase-$PR_NUMBER" || true
          done

      # ---------------------------------------------------------------
      # Lockfile-regen pass. Separate from the rebase sweep above: it acts
      # on a DIFFERENT trigger (the dependency-install-gate's
      # `__INSTALL_GATE_CHECK__` check failing) and on a DIFFERENT
      # candidate set (any author, including Dependabot). See the header
      # comment. The /gh-repo-setup-pr-automation skill drops this whole
      # step (and the auto-rebase-lockfile-regen.sh script) when the repo
      # has no dependency-install-gate workflow to key off.
      # ---------------------------------------------------------------
      - name: Regenerate desynced lockfiles on gate-red PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          BASE_BRANCH: __DEFAULT_BRANCH__
          INSTALL_GATE_WORKFLOW: __INSTALL_GATE_WORKFLOW__
          INSTALL_GATE_CHECK: __INSTALL_GATE_CHECK__
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"
          REGEN="$GITHUB_WORKSPACE/.github/scripts/auto-rebase-lockfile-regen.sh"

          git fetch origin "$BASE_BRANCH"

          # For the `/rebase` slash command, scope the regen pass to the
          # single commenting PR (same scoping as the rebase pass); every
          # other trigger sweeps all open PRs. We enumerate the candidate
          # PR(s) with the conclusion of their dependency-install-gate
          # aggregate check run (the gate the lockfile desync fails). The
          # regen pass runs ONLY on PRs whose aggregate check is FAILURE
          # -- that is the "gate-red-from-lockfile-desync" trigger. The
          # script itself re-confirms the desync (and that it is
          # lockfile-ONLY) before changing anything, so the check-run
          # filter is just a cheap pre-gate to avoid running `npm ci` on
          # every PR every sweep.
          #
          # NOTE: NO Dependabot-author exclusion and NO BEHIND/BLOCKED
          # filter here -- this path is exempt from both (a green-branch
          # gate failure is not behind base, and Dependabot PRs are exactly
          # the ones that need this). The only skips are draft and the
          # `__DO_NOT_MERGE_LABEL__` human escape hatch.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if ! printf '%s' "$COMMENT_BODY" | grep -qE '^[[:space:]]*/rebase[[:space:]]*$'; then
              echo "No standalone /rebase command; skipping lockfile-regen pass."
              exit 0
            fi
            REGEN_JSON=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    number
                    isDraft
                    headRefName
                    headRepositoryOwner { login }
                    baseRefName
                    labels(first: 50) { nodes { name } }
                    commits(last: 1) {
                      nodes { commit { statusCheckRollup { contexts(first: 100) {
                        nodes { __typename
                          ... on CheckRun { name conclusion checkSuite { workflowRun { workflow { name } } } }
                        } } } } }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -F number="$COMMENT_PR_NUMBER")
            CANDIDATES_RAW=$(echo "$REGEN_JSON" | jq -c --arg base "$BASE_BRANCH" '
              .data.repository.pullRequest
              | select(. != null)
              | select(.baseRefName == $base)
              | [.]')
          else
            REGEN_JSON=$(gh api graphql -f query='
              query($owner: String!, $name: String!, $base: String!) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: OPEN, first: 100, baseRefName: $base) {
                    nodes {
                      number
                      isDraft
                      headRefName
                      headRepositoryOwner { login }
                      labels(first: 50) { nodes { name } }
                      commits(last: 1) {
                        nodes { commit { statusCheckRollup { contexts(first: 100) {
                          nodes { __typename
                            ... on CheckRun { name conclusion checkSuite { workflowRun { workflow { name } } } }
                          } } } } }
                      }
                    }
                  }
                }
              }' -f owner="$OWNER" -f name="$NAME" -f base="$BASE_BRANCH")
            CANDIDATES_RAW=$(echo "$REGEN_JSON" | jq -c '
              .data.repository.pullRequests.nodes')
          fi

          # Keep PRs that are not draft, not do-not-merge, and whose
          # dependency-install-gate aggregate CheckRun concluded FAILURE.
          # The install-gate workflow name and the aggregate check name
          # come from the rendered placeholders so the filter tracks the
          # repo's actual gate.
          mapfile -t CANDIDATES < <(echo "$CANDIDATES_RAW" | jq -r \
            --arg gate "$INSTALL_GATE_WORKFLOW" --arg check "$INSTALL_GATE_CHECK" '
            .[]
            | select(.isDraft == false)
            | select([.labels.nodes[].name] | index("__DO_NOT_MERGE_LABEL__") | not)
            | select(
                [ .commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
                  | select(.__typename == "CheckRun")
                  | select(.name == $check)
                  | select((.checkSuite.workflowRun.workflow.name // "") == $gate)
                  | .conclusion ]
                | index("FAILURE")
              )
            | "\(.number)\t\(.headRefName)\t\(.headRepositoryOwner.login)"
          ')

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "No PRs with a failing $INSTALL_GATE_WORKFLOW $INSTALL_GATE_CHECK check; nothing to regenerate."
            exit 0
          fi

          for line in "${CANDIDATES[@]}"; do
            PR_NUMBER=$(echo "$line" | cut -f1)
            HEAD_REF=$(echo "$line" | cut -f2)
            HEAD_OWNER=$(echo "$line" | cut -f3)

            if [ "$HEAD_OWNER" != "$OWNER" ]; then
              echo "PR #$PR_NUMBER: skipping lockfile-regen (head is a fork: $HEAD_OWNER)"
              continue
            fi

            echo "PR #$PR_NUMBER: $INSTALL_GATE_WORKFLOW $INSTALL_GATE_CHECK is red; checking for a lockfile-only desync on $HEAD_REF"

            git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
            EXPECTED_SHA=$(git rev-parse "origin/$HEAD_REF")

            # Detach onto the PR head so we operate without claiming the
            # branch ref locally (same pattern as the rebase loop).
            git checkout -B "auto-regen-$PR_NUMBER" --no-track "origin/$HEAD_REF"

            # The regen script mutates only the lockfiles in the working
            # tree and signals via exit code:
            #   0 -- one or more lockfiles regenerated and replay cleanly;
            #        commit + force-push.
            #   1 -- gate-red for a reason that is NOT a fixable
            #        lockfile-only desync (unsatisfiable manifest, etc.);
            #        leave for a human.
            #   3 -- nothing to do (no desync); leave alone.
            set +e
            bash "$REGEN"
            REGEN_RC=$?
            set -e

            if [ "$REGEN_RC" -eq 0 ]; then
              # `npm install --package-lock-only` only rewrites the
              # lockfile, but stage package.json too so the pair is
              # committed together (a no-op if the manifest is unchanged,
              # which it always is here).
              git add -A '*package-lock.json' '*package.json'
              # Guard the commit like the push below (and the rebase loop's
              # git ops): the per-PR loop runs under `set -e`, so an
              # unguarded commit failure would abort the whole sweep and
              # silently skip every remaining PR. An if/else contains the
              # fault to this one PR; control then falls through to the
              # unconditional cleanup below (same shape as the rebase loop's
              # else-branch), so the auto-regen branch is still cleaned up.
              if git commit -m "Regenerate npm lockfile to match manifest (auto)" \
                -m "$INSTALL_GATE_WORKFLOW $INSTALL_GATE_CHECK check was failing on a lockfile desynced from its manifest. Regenerated with npm install --package-lock-only --ignore-scripts. The re-run of the gate on this push is the verification."; then
                if git push --force-with-lease="$HEAD_REF:$EXPECTED_SHA" origin "HEAD:refs/heads/$HEAD_REF"; then
                  echo "PR #$PR_NUMBER: regenerated lockfile(s) committed and force-pushed"
                else
                  echo "PR #$PR_NUMBER: push rejected (lease lost or auth); skipping"
                fi
              else
                echo "PR #$PR_NUMBER: commit failed; skipping"
              fi
            elif [ "$REGEN_RC" -eq 3 ]; then
              echo "PR #$PR_NUMBER: no lockfile desync to fix; leaving alone"
            else
              echo "PR #$PR_NUMBER: gate-red is not a fixable lockfile-only desync; leaving for a human"
            fi

            git checkout --detach
            git branch -D "auto-regen-$PR_NUMBER" || true
          done

      # ---------------------------------------------------------------
      # Dependabot REST-merge pass. Moved here from
      # auto-enable-automerge.yml's `dependabot-rest-merge` job (issue
      # #77): it fired on the SAME workflow_run event as the rebase
      # sweep above and did the complementary half of the same work, so
      # two billable jobs were paying for one logical sweep. It is the
      # last pass in the job because it must see the rebase and
      # lockfile-regen results, not race them.
      #
      # SCOPED TO THE SWEEP TRIGGERS IT ALWAYS HAD. The `if:` below
      # reproduces the old job's trigger set exactly (workflow_run,
      # workflow_dispatch, schedule) rather than inheriting this
      # workflow's wider one. `push` and `issue_comment` are excluded on
      # purpose: `/rebase` is a request to rebase ONE PR, and letting a
      # comment on one PR merge a repo-wide set of others would be a
      # surprising widening of what that command does.
      # This pass is also why the `on: schedule:` list carries a
      # weekend entry (its `(b)` cron): the old job's own daily backstop
      # covered Saturday and Sunday, and Dependabot goes green on its
      # schedule rather than the team's. The rebase sweep's weekday
      # window would not have covered that.
      #
      # What it does: for a PR whose authoritative author is Dependabot
      # AND whose required status checks are ALL green, it merges via
      # the REST merge endpoint directly. If the App is a `pull_request`
      # bypass actor in the repo's branch-protection ruleset, a direct
      # REST merge ENGAGES the bypass and waives the review/code-owner
      # requirement -- so a green Dependabot PR merges unattended,
      # code-owned paths included. Native `--auto` does NOT engage
      # bypass (it waits for the rules to be satisfied), which is why
      # this pass uses the REST endpoint, not
      # enablePullRequestAutoMerge. Human PRs never reach the merge call
      # here; they go through auto-enable-automerge.yml's native
      # auto-merge path and the normal review + CODEOWNERS route.
      #
      # It drains the queue rather than stalling on behind-base
      # Dependabot PRs:
      #   - Trigger gates on the rollup. A workflow_run firing while
      #     other required workflows are still in flight sees a
      #     non-SUCCESS statusCheckRollup and no-ops; the firing after
      #     the last one completes sees SUCCESS and proceeds. The rollup
      #     IS the "all complete" moment -- no per-suite race, no delay
      #     heuristic.
      #   - Behind-base is throughput, not a stall. The rebase sweep
      #     above deliberately EXCLUDES Dependabot-authored PRs, so
      #     nothing else brings a green-but-behind Dependabot PR
      #     current. This pass therefore REBASES a green-behind PR onto
      #     the base itself and STOPS there for that PR -- it does NOT
      #     merge the rebased head. A clean textual rebase does not
      #     imply an unchanged check outcome (the outcome depends on the
      #     PR's changes AND main's content, so anything that landed on
      #     main since the pre-rebase checks ran can flip the rebased
      #     head red while the rebase stays conflict-free), so the
      #     rebased head's checks must actually re-run and go green
      #     before it is merged. The force-push (on the App token)
      #     re-triggers those checks, and the next sweep evaluates the
      #     rebased head on its own merits. A conflicting rebase is
      #     aborted and the PR left for a human.
      #
      # SECURITY BOUNDARY: a bypass-actor REST merge waives ALL branch-
      # protection rules, not just review -- the ruleset cannot
      # selectively keep status checks enforced while waiving review for
      # a bypass actor. So enforcement moves INTO this pass's
      # preconditions, and these are load-bearing or unreviewed code
      # could merge:
      #   (a) the required status checks (incl. any build gate) are
      #       genuinely required AND this pass verifies they are ALL
      #       green before merging. "Green" is read STRICTLY, matching
      #       what the waived ruleset would have enforced:
      #         - same integration: a ruleset that pins each required
      #           check to an integration_id (e.g. 15368 for GitHub
      #           Actions) is honoured. A green check is matched to a
      #           required one by (context, integration_id), not by
      #           context name alone, so a colliding name from a
      #           different integration cannot satisfy the gate. (A
      #           required check left unpinned in the ruleset falls back
      #           to name-only, which is exactly what the ruleset itself
      #           enforces for it.)
      #         - head current with base: if the ruleset sets
      #           strict_required_status_checks_policy: true, a check
      #           only counts when the head is current with the base. A
      #           green-against-stale-base head is never merged AS-IS.
      #           This pass re-implements the policy with `git
      #           merge-base --is-ancestor origin/__DEFAULT_BRANCH__
      #           <HEAD_OID>`, per the rebase-and-stop behaviour
      #           described above.
      #   (b) the author gate uses the AUTHORITATIVE Dependabot
      #       identity, not a spoofable field. We verify
      #       `author.login == "dependabot"` AND the HEAD commit author
      #       login is `dependabot[bot]` (the same authoritative signal
      #       the rebase sweep above uses), so a human who merely titles
      #       a PR "dependabot" cannot trip the gate.
      #
      # NOTE on the bypass actor: this pass only achieves an unattended
      # merge of a code-owner-protected PR if the App "__APP_NAME__" is
      # added as a `pull_request` bypass actor in the repo's
      # branch-protection ruleset. Adding the bypass actor is a
      # branch-protection concern owned by /gh-repo-setup-protection,
      # not this skill. Without the bypass, a green Dependabot PR on an
      # un-code-owned path still merges (no review required); one on a
      # code-owned path is left for a human, exactly as a human PR would
      # be.
      # ---------------------------------------------------------------
      - name: REST-merge green Dependabot PRs
        if: >-
          github.event_name == 'workflow_run' ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: __DEFAULT_BRANCH__
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # ---------------------------------------------------------------
          # 1. Resolve the set of REQUIRED status checks from the LIVE
          #    rulesets at runtime, rather than hardcoding a list that rots
          #    when a check is added/removed. Security boundary (a): "green"
          #    must mean every required check passed, so we must know exactly
          #    which checks are required.
          #
          #    We carry the per-check `integration_id` alongside the context,
          #    NOT the context name alone. A ruleset that pins each required
          #    check to an integration_id (e.g. 15368 for GitHub Actions) is
          #    honoured. Matching the green set by NAME ONLY would let a green
          #    status/check with a colliding name from a DIFFERENT integration
          #    satisfy the gate -- strictly weaker than the rule we are
          #    waiving. So a required `(context, integration_id)` is satisfied
          #    below only by a green check from the SAME integration. A
          #    required check with no integration pin (integration_id absent)
          #    keeps the old name-only behaviour for that entry (any
          #    integration may satisfy it), which matches what the ruleset
          #    itself enforces.
          #
          #    We collect across all ACTIVE rulesets that apply (matching by
          #    rule type, not by ruleset name, so a rename does not silently
          #    drop the gate), and fail closed (exit 1) if the aggregate is
          #    empty -- merging while blind to the required set would defeat
          #    the security boundary. Aggregating across every active ruleset
          #    is conservative by construction: an extra required check can
          #    only make this job MORE likely to refuse a merge, never less,
          #    so it cannot cause an under-checked merge.
          #
          #    Each required entry is emitted as "<context>\t<integration_id>"
          #    with the integration_id rendered as the empty string when the
          #    ruleset left it unpinned.
          RULESETS=$(gh api "repos/${OWNER}/${NAME}/rulesets?includes_parents=false" --paginate)
          REQUIRED_CHECKS=""
          for RS_ID in $(echo "$RULESETS" | jq -r '.[].id'); do
            RS=$(gh api "repos/${OWNER}/${NAME}/rulesets/${RS_ID}")
            # Only consider active rulesets that target the branch.
            ENFORCEMENT=$(echo "$RS" | jq -r '.enforcement')
            [ "$ENFORCEMENT" = "active" ] || continue
            CHECKS=$(echo "$RS" | jq -r '
              .rules[]
              | select(.type == "required_status_checks")
              | .parameters.required_status_checks[]
              | "\(.context)\t\(.integration_id // "")"' 2>/dev/null || true)
            if [ -n "$CHECKS" ]; then
              REQUIRED_CHECKS="${REQUIRED_CHECKS}${CHECKS}"$'\n'
            fi
          done
          # Deduplicate and drop blank lines.
          REQUIRED_CHECKS=$(printf '%s' "$REQUIRED_CHECKS" | grep -v '^[[:space:]]*$' | sort -u || true)
          if [ -z "$REQUIRED_CHECKS" ]; then
            echo "::error::Could not resolve any required status checks from active rulesets on ${REPO}. Refusing to bypass-merge while blind to the required set (security boundary a)."
            exit 1
          fi
          echo "Required status checks (context + integration_id, from live ruleset):"
          while IFS=$'\t' read -r rc_ctx rc_int; do
            [ -n "$rc_ctx" ] || continue
            echo "  - ${rc_ctx} @integration:${rc_int:-<unpinned>}"
          done <<< "$REQUIRED_CHECKS"

          # ---------------------------------------------------------------
          # 2. Enumerate open, non-draft, non-do-not-merge PRs targeting the
          #    base branch, with the authoritative author signal and the head
          #    commit's full status-check rollup. The author gate (security
          #    boundary b) is authoritative: a PR is Dependabot's iff
          #    `author.login == "dependabot"` AND the HEAD commit author
          #    login is `dependabot[bot]` (the same signal auto-rebase-prs
          #    uses). A spoofable field (title/body) is never consulted.
          PRS_JSON=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $base: String!) {
              repository(owner: $owner, name: $name) {
                pullRequests(states: OPEN, first: 100, baseRefName: $base) {
                  nodes {
                    number
                    isDraft
                    author { login }
                    headRefName
                    headRefOid
                    headRepositoryOwner { login }
                    labels(first: 50) { nodes { name } }
                    commits(last: 1) {
                      nodes {
                        commit {
                          author { user { login } }
                          statusCheckRollup {
                            state
                            contexts(first: 100) {
                              nodes {
                                __typename
                                ... on CheckRun {
                                  name
                                  conclusion
                                  status
                                  checkSuite { app { databaseId } }
                                }
                                ... on StatusContext { context state }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f owner="$OWNER" -f name="$NAME" -f base="$BASE_BRANCH")

          # Candidate Dependabot PRs: not draft, not do-not-merge,
          # authoritative Dependabot author, AND GitHub's aggregate verdict
          # statusCheckRollup.state == SUCCESS. The rollup state is the
          # accurate "every check on this head has completed and passed"
          # signal -- the per-suite check_suite event is not (a head has
          # several suites). Gating here means a workflow_run firing while
          # other required workflows are still in flight sees a non-SUCCESS
          # rollup and produces zero candidates, a clean no-op; the firing
          # after the LAST required workflow completes sees SUCCESS and this
          # PR becomes a candidate. The per-required-check verification
          # below (the strict security boundary) still runs -- the rollup
          # gate is the convergence signal, not the authorization. A PR with
          # no checks at all has rollup state null and is correctly dropped.
          #
          # Emit "<number>\t<headOwner>\t<headOid>\t<headRefName>". headOid
          # is the exact commit whose checks we evaluated; headRefName is
          # needed to force-push a rebase. Passing headOid (or, after a
          # rebase, the rebased head) as the merge `sha` makes the merge
          # reject (409) if the head moved since -- closing the window
          # between reading the checks and merging.
          mapfile -t CANDIDATES < <(echo "$PRS_JSON" | jq -r '
            .data.repository.pullRequests.nodes[]
            | select(.isDraft == false)
            | select([.labels.nodes[].name] | index("__DO_NOT_MERGE_LABEL__") | not)
            | select(.author.login == "dependabot")
            | select((.commits.nodes[0].commit.author.user.login // "") == "dependabot[bot]")
            | select((.commits.nodes[0].commit.statusCheckRollup.state // "") == "SUCCESS")
            | "\(.number)\t\(.headRepositoryOwner.login)\t\(.headRefOid)\t\(.headRefName)"
          ')

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "No eligible Dependabot PRs to consider."
            exit 0
          fi

          for line in "${CANDIDATES[@]}"; do
            PR_NUMBER=$(echo "$line" | cut -f1)
            HEAD_OWNER=$(echo "$line" | cut -f2)
            HEAD_OID=$(echo "$line" | cut -f3)
            HEAD_REF=$(echo "$line" | cut -f4)

            # Same-repo only; we cannot merge fork PRs with this token and
            # Dependabot PRs are same-repo anyway.
            if [ "$HEAD_OWNER" != "$OWNER" ]; then
              echo "PR #$PR_NUMBER: skipping (head is a fork: $HEAD_OWNER)"
              continue
            fi

            # A fetch failure here must NOT be swallowed: the ancestry test
            # and the rebase base below would silently use a possibly-stale
            # origin/$BASE_BRANCH, so log loudly and skip just this PR (per-PR
            # idiom, so set -e does not abort the whole sweep) rather than
            # proceeding against a stale base. The next sweep retries.
            if ! git fetch --quiet origin "$BASE_BRANCH" 2>/dev/null; then
              echo "::warning::PR #$PR_NUMBER: could not fetch origin $BASE_BRANCH; skipping to avoid acting on a stale base. Leaving for the next sweep."
              continue
            fi
            if ! git fetch --quiet origin "$HEAD_OID" 2>/dev/null; then
              echo "PR #$PR_NUMBER: could not fetch head $HEAD_OID; leaving for the next sweep."
              continue
            fi

            # Build the set of green (context, integration_id) pairs for this
            # PR's head commit. A CheckRun is green iff status COMPLETED and
            # conclusion SUCCESS; its integration_id is its check suite's app
            # databaseId. A StatusContext is green iff state SUCCESS; GraphQL
            # exposes no integration id for a StatusContext, so it is emitted
            # with an empty integration_id and can therefore satisfy only a
            # required check that is itself unpinned (integration_id absent).
            # Anything else (in-progress, failure, neutral, cancelled,
            # skipped, ...) is NOT counted as green. Each pair is
            # "<context>\t<integration_id>".
            GREEN_CHECKS=$(echo "$PRS_JSON" | jq -r --argjson num "$PR_NUMBER" '
              .data.repository.pullRequests.nodes[]
              | select(.number == $num)
              | .commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]?
              | if .__typename == "CheckRun" then
                  (select(.status == "COMPLETED" and .conclusion == "SUCCESS")
                    | "\(.name)\t\(.checkSuite.app.databaseId // "")")
                elif .__typename == "StatusContext" then
                  (select(.state == "SUCCESS") | "\(.context)\t")
                else empty end
            ' | sort -u)

            # Every required check must be satisfied by a green check with
            # the SAME context AND a matching integration: the green pair's
            # integration_id must equal the required integration_id, unless
            # the required check left it unpinned (empty), in which case any
            # integration -- including a StatusContext -- may satisfy it.
            MISSING=""
            while IFS=$'\t' read -r req_ctx req_int; do
              [ -n "$req_ctx" ] || continue
              if [ -n "$req_int" ]; then
                want="${req_ctx}"$'\t'"${req_int}"
                if ! printf '%s\n' "$GREEN_CHECKS" | grep -qxF "$want"; then
                  MISSING="${MISSING}${req_ctx}@${req_int} "
                fi
              else
                # Unpinned required check: match the context regardless of
                # the green check's integration_id.
                if ! printf '%s\n' "$GREEN_CHECKS" | cut -f1 | grep -qxF "$req_ctx"; then
                  MISSING="${MISSING}${req_ctx} "
                fi
              fi
            done <<< "$REQUIRED_CHECKS"

            if [ -n "$MISSING" ]; then
              echo "PR #$PR_NUMBER: not merging -- required checks not all green from the required integration (missing/non-success: ${MISSING})"
              continue
            fi

            # Head-current-with-base, by rebasing in-workflow when behind. A
            # ruleset with strict_required_status_checks_policy: true means a
            # required check only counts when the head is current with the
            # base; a bypass REST merge waives that too. Instead of SKIPPING
            # a green-but-behind PR (which would stall because auto-rebase-prs
            # excludes Dependabot PRs, so nothing ever brought them current),
            # bring it current HERE -- but do NOT merge it in this same pass:
            #   - already current -> fall through and merge HEAD_OID as-is;
            #     its checks were evaluated on exactly this head.
            #   - behind, clean rebase -> force-push the rebased head and
            #     STOP (continue to the next candidate). A clean textual
            #     rebase does not imply the rebased head's checks would still
            #     pass -- the check outcome depends on the PR's changes AND
            #     main's content, so something that landed on main after the
            #     pre-rebase checks ran can flip the rebased head red while
            #     the rebase itself stays conflict-free (see the job-level
            #     NOTE above). The force-push (on the App token) re-triggers
            #     the rebased head's checks; a later workflow_run sweep sees
            #     this PR current-with-base and merges it via the
            #     already-current path above once those checks verify green
            #     ON THE REBASED HEAD ITSELF. Cost: one extra check cycle;
            #     benefit: no head is ever merged whose checks were not
            #     evaluated on exactly that head.
            #   - behind, conflicting rebase -> abort and leave the PR
            #     untouched (no comment, no failure); a human resolves it.
            #     This is the only case that orphans a Dependabot PR (a
            #     non-Dependabot push stops Dependabot managing it), and it
            #     would have stalled regardless.
            # This still drains the cascade: one merge advances the base and
            # makes others behind, but each other PR's next completion event
            # rebases it, and the completion event after ITS re-run checks go
            # green merges it, so the queue self-drains with no external
            # auto-rebase needed (which would not act on Dependabot PRs
            # anyway) -- just one extra check cycle per rebased PR.
            if git merge-base --is-ancestor "origin/$BASE_BRANCH" "$HEAD_OID"; then
              echo "PR #$PR_NUMBER: head already current with $BASE_BRANCH."
            else
              echo "PR #$PR_NUMBER: head behind $BASE_BRANCH; rebasing in-workflow and stopping for this PR (checks must re-run before it can merge)."
              EXPECTED_SHA=$(git rev-parse "$HEAD_OID")
              # Detach onto the PR head so we rebase without claiming the
              # branch ref locally (same pattern as auto-rebase-prs.yml).
              git checkout -B "auto-merge-rebase-$PR_NUMBER" --no-track "$HEAD_OID"
              if git rebase "origin/$BASE_BRANCH"; then
                REBASED_OID=$(git rev-parse HEAD)
                # --force-with-lease rejects the push if a concurrent author
                # push moved the branch since we read HEAD_OID, instead of
                # clobbering it. The push is as the App, so downstream checks
                # re-run on the rebased head -- this re-run is now load-
                # bearing: it is the ONLY thing that will let this PR merge,
                # via a future sweep once it verifies green.
                if git push --force-with-lease="$HEAD_REF:$EXPECTED_SHA" origin "HEAD:refs/heads/$HEAD_REF"; then
                  echo "PR #$PR_NUMBER: rebased onto $BASE_BRANCH and force-pushed ($REBASED_OID); not merging -- leaving for a future sweep once its checks re-run and verify green."
                else
                  echo "PR #$PR_NUMBER: rebase push rejected (lease lost or auth); leaving for the next sweep."
                fi
              else
                echo "PR #$PR_NUMBER: rebase produced conflicts; aborting and leaving for a human."
                git rebase --abort || true
              fi
              git checkout --detach
              git branch -D "auto-merge-rebase-$PR_NUMBER" || true
              continue
            fi

            echo "PR #$PR_NUMBER: all required checks green from the required integration and head already current with $BASE_BRANCH; merging it as-is via REST (engages bypass to waive review only)."

            # Direct REST merge ENGAGES the App's pull_request bypass and
            # waives the review/code-owner rule. `--auto` (native
            # auto-merge) does NOT engage bypass and would just hang on the
            # unmet review requirement, which is why
            # auto-enable-automerge.yml's enablePullRequestAutoMerge
            # cannot merge a Dependabot PR that touches a code-owner
            # path. The commit subject follows the same
            # "Merge PR: <title> (#<num>)" convention as
            # auto-enable-automerge.yml's native path. Title/body
            # come from REST (not fetched in the GraphQL enumeration above)
            # and only shape the merge-commit message. Fail-safe: a transient
            # error on this single read skips just this PR rather than
            # aborting the whole sweep under set -e.
            if ! PR_VIEW=$(gh api "repos/${OWNER}/${NAME}/pulls/${PR_NUMBER}"); then
              echo "PR #$PR_NUMBER: could not fetch PR view (transient API error); leaving for the next sweep."
              continue
            fi
            PR_TITLE=$(echo "$PR_VIEW" | jq -r '.title')
            PR_BODY=$(echo "$PR_VIEW" | jq -r '.body // ""')
            PR_URL=$(echo "$PR_VIEW" | jq -r '.html_url')

            # GitHub caps commit messages at 16383 chars. A large grouped
            # Dependabot PR body (release notes x N, itself already capped
            # at Dependabot's 64K body limit) can blow past that, which
            # would otherwise 422 this merge call every sweep -- the PR
            # goes green but can never unattended-merge. Truncate at 16000
            # chars (headroom under 16383 for the marker line, the URL,
            # and the joining newlines) and append the PR URL so the
            # untruncated body is always reachable. Bodies under the cap
            # pass through unchanged. Apply identically to
            # auto-enable-automerge.yml's native path so the
            # native-auto-merge and REST-merge commit messages stay
            # consistent.
            if [ "${#PR_BODY}" -gt 16000 ]; then
              PR_BODY="${PR_BODY:0:16000}"$'\n\n'"[TRUNCATED — full description: ${PR_URL}]"
            fi

            # Pass the EVALUATED head sha (HEAD_OID -- by this point the PR
            # is known current with the base, so this is the exact commit
            # whose checks we just verified all-green) so the merge is
            # rejected (409) if the head moved AT ALL since we verified it --
            # e.g. a concurrent author push. We then skip rather than merge
            # an unverified head; the next workflow_run/schedule sweep
            # re-evaluates the new head.
            if gh api --method PUT "repos/${OWNER}/${NAME}/pulls/${PR_NUMBER}/merge" \
              -f sha="$HEAD_OID" \
              -f merge_method="__REST_MERGE_METHOD__" \
              -f commit_title="Merge PR: ${PR_TITLE} (#${PR_NUMBER})" \
              -f commit_message="${PR_BODY}"; then
              echo "PR #$PR_NUMBER: merged."
            else
              echo "PR #$PR_NUMBER: REST merge did not succeed (head may have moved, or a transient API error); leaving for the next sweep."
            fi
          done
